<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalkline — Classrooms &amp; Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk-dark:#2F4538;
    --chalk-darker:#223228;
    --paper:#F7F4EC;
    --paper-dim:#EFEAD9;
    --ink:#26302A;
    --marker-blue:#3B6EA5;
    --marker-blue-dim:#e7eef5;
    --marker-red:#C6503E;
    --marker-red-dim:#f7e9e6;
    --marker-yellow:#D89B2E;
    --marker-yellow-dim:#faf0dc;
    --marker-purple:#7A5FA3;
    --marker-purple-dim:#efe9f5;
    --muted:#818979;
    --line:#D8D2C0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--chalk-darker);
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}

  .topbar{
    background:var(--chalk-dark);
    color:var(--paper);
    padding:14px 28px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:18px;color:#fff;}
  .brand .dot-line{display:inline-flex;gap:3px;}
  .brand .dot-line span{width:5px;height:5px;border-radius:50%;background:var(--marker-yellow);display:inline-block;}
  .topbar .who{font-size:13px;color:#cfd8cd;display:flex;align-items:center;gap:14px;}
  .topbar button.link{background:none;border:1px solid rgba(255,255,255,0.35);color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;}
  .topbar button.link:hover{background:rgba(255,255,255,0.12);}

  main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:34px 24px 80px;}

  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px;}
  .crumbs button{background:none;border:none;color:var(--muted);font-size:13px;padding:0;font-weight:600;}
  .crumbs button:hover{color:var(--marker-blue);}
  .crumbs .sep{color:var(--line);}
  .crumbs .current{color:var(--ink);font-weight:600;}

  .landing-hero{text-align:center;padding:60px 20px 20px;}
  .landing-hero h1{font-size:44px;margin:0 0 10px;}
  .landing-hero p{color:var(--muted);font-size:16px;max-width:480px;margin:0 auto 36px;}
  .portal-choice{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
  .portal-card{
    background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:32px 30px;width:260px;text-align:left;transition:transform .15s ease, box-shadow .15s ease;
  }
  .portal-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(47,69,56,0.12);}
  .portal-card .icon{font-size:26px;margin-bottom:10px;}
  .portal-card h3{margin:0 0 6px;font-size:19px;}
  .portal-card p{color:var(--muted);font-size:13.5px;margin:0 0 18px;}
  .portal-card button{width:100%;}

  .btn{
    border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;justify-content:center;
  }
  .btn-primary{background:var(--chalk-dark);color:#fff;}
  .btn-primary:hover{background:var(--chalk-darker);}
  .btn-blue{background:var(--marker-blue);color:#fff;}
  .btn-blue:hover{opacity:.9;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--chalk-dark);}
  .btn-danger{background:var(--marker-red-dim);color:var(--marker-red);}
  .btn-danger:hover{background:#f2d9d4;}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:7px;}
  .btn-full{width:100%;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .auth-wrap{max-width:380px;margin:20px auto;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;}
  .card h2{margin-top:0;font-size:21px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--marker-blue);outline-offset:1px;border-color:var(--marker-blue);}
  .auth-switch{text-align:center;margin-top:14px;font-size:13.5px;color:var(--muted);}
  .auth-switch button{background:none;border:none;color:var(--marker-blue);font-weight:600;text-decoration:underline;padding:0;}
  .error-msg{background:var(--marker-red-dim);color:var(--marker-red);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;}
  .back-link{background:none;border:none;color:var(--muted);font-size:13.5px;margin-bottom:18px;display:inline-flex;align-items:center;gap:5px;}
  .back-link:hover{color:var(--ink);}

  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-head h1{font-size:26px;margin:0;}
  .empty-state{border:1.5px dashed var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;}
  .tile.clickable{cursor:pointer;transition:box-shadow .15s ease, transform .15s ease;}
  .tile.clickable:hover{box-shadow:0 8px 18px rgba(47,69,56,0.1);transform:translateY(-2px);}
  .tile h3{margin:0 0 4px;font-size:17px;}
  .tile .meta{color:var(--muted);font-size:12.5px;margin-bottom:12px;}
  .tile .subject-icon{font-size:22px;margin-bottom:8px;}
  .code-pill{
    display:inline-flex;align-items:center;gap:6px;background:var(--marker-yellow-dim);color:#8a6412;
    font-family:'JetBrains Mono';font-weight:700;padding:4px 10px;border-radius:7px;font-size:13px;letter-spacing:.04em;
  }
  .tile-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

  .dot-rule{
    height:1px;background-image:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);
    margin:10px 0;
  }
  .list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:10px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .tabs button{background:none;border:none;padding:10px 4px;margin-right:22px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;}
  .tabs button.active{color:var(--chalk-darker);border-bottom-color:var(--marker-blue);}

  .material-row{display:flex;align-items:center;gap:12px;padding:13px 0;}
  .material-icon{
    width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:17px;flex-shrink:0;
  }
  .material-icon.slides{background:var(--marker-red-dim);}
  .material-icon.doc{background:var(--marker-blue-dim);}
  .material-icon.video{background:var(--marker-purple-dim);}
  .material-icon.link{background:var(--marker-yellow-dim);}
  .material-info{flex:1;min-width:0;}
  .material-info .mtitle{font-weight:600;font-size:14.5px;}
  .material-info .mdesc{color:var(--ink);opacity:0.75;font-size:13px;margin-top:2px;line-height:1.4;}
  .material-info .murl{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .material-type-select{display:flex;gap:8px;flex-wrap:wrap;}
  .type-chip{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;background:#fff;color:var(--muted);}
  .type-chip.active{border-color:var(--marker-blue);color:var(--marker-blue);background:var(--marker-blue-dim);}

  .qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;position:relative;}
  .qcard .qtype-badge{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:10px;
  }
  .qtype-badge.mcq{background:var(--marker-blue-dim);color:var(--marker-blue);}
  .qtype-badge.tf{background:var(--marker-yellow-dim);color:#8a6412;}
  .qtype-badge.match{background:var(--marker-red-dim);color:var(--marker-red);}
  .qtype-badge.short{background:var(--marker-purple-dim);color:var(--marker-purple);}
  .qtype-badge.long{background:var(--paper-dim);color:var(--muted);}
  .qcard .remove-q{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:13px;}
  .qcard .remove-q:hover{color:var(--marker-red);}
  .opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .opt-row input[type=text]{flex:1;}
  .add-q-bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;}

  .progress-track{display:flex;gap:5px;margin-bottom:24px;}
  .progress-track .seg{height:5px;flex:1;background:var(--line);border-radius:3px;}
  .progress-track .seg.done{background:var(--chalk-dark);}
  .q-text{font-size:18px;font-weight:600;margin-bottom:16px;color:var(--chalk-darker);}
  .choice-row{
    display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:10px;background:#fff;
  }
  .choice-row.selected{border-color:var(--marker-blue);background:var(--marker-blue-dim);}
  .choice-row:hover{cursor:pointer;border-color:var(--marker-blue);}

  .match-wrap{position:relative;display:flex;justify-content:space-between;gap:60px;padding:10px 0;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:10px;}
  .match-item{
    border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;background:#fff;font-size:14px;
    cursor:pointer;position:relative;
  }
  .match-item.left{text-align:left;}
  .match-item.right{text-align:right;}
  .match-item.pending{border-color:var(--marker-yellow);background:var(--marker-yellow-dim);}
  .match-item.paired{border-color:var(--marker-blue);}
  .match-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}

  .score-hero{text-align:center;padding:34px 20px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:24px;}
  .score-hero .num{font-family:'Space Grotesk';font-size:52px;font-weight:700;color:var(--chalk-dark);}
  .score-hero .num span{font-size:22px;color:var(--muted);font-weight:500;}
  .review-row{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
  .review-row.correct{border-left:4px solid #4f8f5f;}
  .review-row.incorrect{border-left:4px solid var(--marker-red);}
  .review-row.pending{border-left:4px solid var(--marker-yellow);}
  .review-row .tag{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);}
  .settings-check{display:flex;align-items:center;gap:8px;text-transform:none;font-weight:500;color:var(--ink);font-size:14px;}

  table.results-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  table.results-table th,table.results-table td{padding:11px 14px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line);}
  table.results-table th{background:var(--paper-dim);color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em;}
  table.results-table tr:last-child td{border-bottom:none;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--chalk-darker);color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;
    box-shadow:0 8px 22px rgba(0,0,0,.2);z-index:50;
  }
  .confirm-overlay{
    position:fixed;inset:0;background:rgba(38,48,42,0.45);display:flex;align-items:center;justify-content:center;
    z-index:60;padding:20px;
  }
  .confirm-box{background:#fff;border-radius:14px;padding:24px;max-width:360px;width:100%;box-shadow:0 14px 34px rgba(0,0,0,.22);}
  .confirm-box p{margin:0 0 18px;font-size:15px;color:var(--ink);}
  .confirm-actions{display:flex;justify-content:flex-end;gap:10px;}
  @media(max-width:640px){
    .match-wrap{gap:24px;}
    .landing-hero h1{font-size:32px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DATA LAYER
   Hierarchy: classroom (e.g. 7A) -> subjects (e.g. English,
   Math) -> materials (links/slides/docs) + tests.
   Everything shared so teacher + student views see one world.
   NOTE: passwords are stored in plain text — fine for a
   prototype, not for a real deployment with real students.
   ========================================================= */
const DATA_KEY = 'chalkline-data-v3';
let DATA = null;

function blankData(){
  return { classrooms:{}, subjects:{}, materials:{}, tests:{}, submissions:{} };
}

async function loadData(){
  try{
    const res = await window.storage.get(DATA_KEY, true);
    DATA = res ? JSON.parse(res.value) : blankData();
  }catch(e){
    DATA = blankData();
  }
  const b = blankData();
  Object.keys(b).forEach(k=>{ if(!DATA[k]) DATA[k]=b[k]; });
}

async function saveData(){
  try{
    await window.storage.set(DATA_KEY, JSON.stringify(DATA), true);
  }catch(e){
    toast('Could not save — try again');
  }
}

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function joinCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c = '';
  for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}

const MATERIAL_TYPES = [
  {id:'slides', label:'Slides / PPT', icon:'📊'},
  {id:'doc', label:'Document', icon:'📄'},
  {id:'video', label:'Video', icon:'🎬'},
  {id:'link', label:'Link', icon:'🔗'}
];

/* =========================================================
   APP STATE
   ========================================================= */
let state = {
  view:'landing',
  role:null,

  activeClassroomId:null,

  activeSubjectId:null,
  activeSubjectTab:'materials',
  newMaterialType:'slides',

  builderSubjectId:null,
  builderTitle:'',
  builderQuestions:[],

  activeTestId:null,
  takingTestId:null,
  takingQuestions:[],
  takingDeadlineAt:null,
  takingAnswers:{},
  takingPending:{},
  takingIndex:0,
  takingIdentity:{name:'', cls:'', number:''},
  identityError:'',

  resultSubmissionId:null,
  resultsTestId:null,

  confirmDialog:null,

  studentActiveClassroomId:null,
  studentActiveSubjectId:null,
  studentSessionClassroomIds:[]
};

function setState(patch){
  state = Object.assign({}, state, patch);
  render();
}

function askConfirm(message, onConfirm){
  setState({confirmDialog:{message, onConfirm}});
}
function resolveConfirm(confirmed){
  const cb = state.confirmDialog && state.confirmDialog.onConfirm;
  setState({confirmDialog:null});
  if(confirmed && cb) cb();
}

let toastTimer=null;
function toast(msg){
  clearTimeout(toastTimer);
  let el = document.getElementById('toast');
  if(!el){
    el = document.createElement('div');
    el.id='toast';
    el.className='toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display='block';
  toastTimer = setTimeout(()=>{ el.style.display='none'; }, 2400);
}

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function allClassrooms(){
  return Object.entries(DATA.classrooms).map(([id,c])=>Object.assign({id},c));
}
function classroomSubjects(classroomId){
  return Object.entries(DATA.subjects).filter(([id,s])=>s.classroomId===classroomId).map(([id,s])=>Object.assign({id},s));
}
function subjectMaterials(subjectId){
  return Object.entries(DATA.materials).filter(([id,m])=>m.subjectId===subjectId).map(([id,m])=>Object.assign({id},m)).sort((a,b)=>a.addedAt-b.addedAt);
}
function subjectTests(subjectId){
  return Object.entries(DATA.tests).filter(([id,t])=>t.subjectId===subjectId).map(([id,t])=>Object.assign({id},t));
}
function sessionClassrooms(){
  return state.studentSessionClassroomIds.map(id=>Object.assign({id}, DATA.classrooms[id])).filter(c=>c.name);
}
function testSubmissions(testId){
  return Object.entries(DATA.submissions).filter(([id,s])=>s.testId===testId).map(([id,s])=>Object.assign({id},s));
}
function materialTypeInfo(typeId){
  return MATERIAL_TYPES.find(t=>t.id===typeId) || MATERIAL_TYPES[3];
}

function testSettings(t){
  return Object.assign({shuffle:false, timeLimitMin:0, showResults:true, allowRetake:true}, (t&&t.settings)||{});
}
function shuffleArray(arr){
  const a = arr.slice();
  for(let k=a.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; }
  return a;
}
function answerPreview(q, ans){
  if(q.type==='mcq') return (ans!=null && q.options[ans]!==undefined) ? q.options[ans] : '(no answer)';
  if(q.type==='tf') return ans===true ? 'True' : ans===false ? 'False' : '(no answer)';
  if(q.type==='match') return (ans && ans.length) ? ans.map(p=>`${q.terms[p.left]} → ${q.defs[p.right]}`).join('; ') : '(no answer)';
  if(q.type==='short' || q.type==='long') return (ans && String(ans).trim()) ? ans : '(no answer)';
  return '';
}

/* =========================================================
   TEST TIMER (for tests with a time limit)
   ========================================================= */
let testTimerInterval = null;
function clearTestTimer(){
  if(testTimerInterval){ clearInterval(testTimerInterval); testTimerInterval=null; }
}
function formatCountdown(ms){
  const total = Math.max(0, Math.ceil(ms/1000));
  const m = Math.floor(total/60), s = total%60;
  return m+':'+String(s).padStart(2,'0');
}
function startTestTimer(){
  clearTestTimer();
  testTimerInterval = setInterval(()=>{
    const el = document.getElementById('test-timer');
    if(!el || !state.takingDeadlineAt || state.view!=='take-test'){ clearTestTimer(); return; }
    const remain = state.takingDeadlineAt - Date.now();
    if(remain<=0){
      clearTestTimer();
      autoSubmitTest();
      return;
    }
    el.textContent = formatCountdown(remain);
  }, 1000);
}
async function autoSubmitTest(){
  toast("Time's up — submitting your test");
  await submitTest();
}

/* =========================================================
   PORTAL NAVIGATION (no accounts — pick a portal, go straight in)
   ========================================================= */
function enterTeacherPortal(){
  setState({view:'teacher-dashboard', role:'teacher', activeClassroomId:null});
}
function enterStudentPortal(){
  setState({view:'student-dashboard', role:'student', studentActiveClassroomId:null});
}
function goHome(){
  clearTestTimer();
  setState({view:'landing', role:null,
    activeClassroomId:null, activeSubjectId:null, studentActiveClassroomId:null, studentActiveSubjectId:null});
}

/* =========================================================
   TEACHER — CLASSROOM ACTIONS
   ========================================================= */
async function createClassroom(){
  const input = document.getElementById('new-classroom-name');
  const name = input.value.trim();
  if(!name) return;
  const id = uid('cls');
  DATA.classrooms[id] = { name, code: joinCode() };
  await saveData();
  input.value='';
  render();
  toast('Classroom created');
}

function openClassroom(id){
  setState({view:'classroom-detail', activeClassroomId:id});
}

async function deleteClassroom(id){
  delete DATA.classrooms[id];
  const subjIds = classroomSubjects(id).map(s=>s.id);
  subjIds.forEach(sid=>{
    delete DATA.subjects[sid];
    Object.keys(DATA.materials).forEach(mid=>{ if(DATA.materials[mid].subjectId===sid) delete DATA.materials[mid]; });
    Object.keys(DATA.tests).forEach(tid=>{ if(DATA.tests[tid].subjectId===sid) delete DATA.tests[tid]; });
  });
  await saveData();
  setState({view:'teacher-dashboard'});
}

async function createSubject(){
  const input = document.getElementById('new-subject-name');
  const name = input.value.trim();
  if(!name) return;
  const id = uid('subj');
  DATA.subjects[id] = { classroomId: state.activeClassroomId, name };
  await saveData();
  input.value='';
  render();
  toast('Subject added');
}

function openSubject(id){
  setState({view:'subject-detail', activeSubjectId:id, activeSubjectTab:'materials'});
}

async function deleteSubject(id){
  delete DATA.subjects[id];
  Object.keys(DATA.materials).forEach(mid=>{ if(DATA.materials[mid].subjectId===id) delete DATA.materials[mid]; });
  Object.keys(DATA.tests).forEach(tid=>{ if(DATA.tests[tid].subjectId===id) delete DATA.tests[tid]; });
  await saveData();
  setState({view:'classroom-detail'});
}

async function addMaterial(){
  const titleEl = document.getElementById('material-title');
  const descEl = document.getElementById('material-desc');
  const urlEl = document.getElementById('material-url');
  const title = titleEl.value.trim();
  const description = descEl.value.trim();

function addBuilderQuestion(type){
  let q;
  if(type==='mcq') q = {type:'mcq', text:'', options:['',''], correct:0};
  else if(type==='tf') q = {type:'tf', text:'', correct:true};
  else if(type==='match') q = {type:'match', text:'Match each term to its definition', terms:['',''], defs:['','']};
  else if(type==='short') q = {type:'short', text:'', accepted:['']};
  else q = {type:'long', text:'', modelAnswer:''};
  setState({builderQuestions:[...state.builderQuestions, q]});
}
function removeBuilderQuestion(idx){
  const qs = state.builderQuestions.slice();
  qs.splice(idx,1);
  setState({builderQuestions:qs});
}
function updateBuilderQuestion(idx, patch){
  const qs = state.builderQuestions.slice();
  qs[idx] = Object.assign({}, qs[idx], patch);
  state.builderQuestions = qs;
}

async function saveTest(){
  const title = document.getElementById('builder-title-input').value.trim();
  if(!title){ toast('Give the test a title first'); return; }
  if(state.builderQuestions.length===0){ toast('Add at least one question'); return; }
  for(const q of state.builderQuestions){
    if(!q.text || !q.text.trim()){ toast('Every question needs its text filled in'); return; }
    if(q.type==='mcq' && q.options.some(o=>!o.trim())){ toast('Fill in every answer choice'); return; }
    if(q.type==='match' && (q.terms.some(t=>!t.trim()) || q.defs.some(d=>!d.trim()))){ toast('Fill in every term and definition'); return; }
    if(q.type==='short' && !(q.accepted||[]).some(a=>a.trim())){ toast('Give at least one accepted answer for each short-answer question'); return; }
  }
  const settings = {
    shuffle: !!document.getElementById('builder-shuffle').checked,
    timeLimitMin: Math.max(0, parseInt(document.getElementById('builder-timelimit').value,10) || 0),
    showResults: !!document.getElementById('builder-showresults').checked,
    allowRetake: !!document.getElementById('builder-allowretake').checked
  };
  const id = uid('test');
  DATA.tests[id] = { subjectId: state.builderSubjectId, title, questions: state.builderQuestions, settings };
  await saveData();
  setState({view:'subject-detail', activeSubjectId: state.builderSubjectId, activeSubjectTab:'tests'});
  toast('Test saved');
}

function startIdentifiedTest(){
  const name = document.getElementById('ident-name').value.trim();
  const cls = document.getElementById('ident-class').value.trim();
  const number = document.getElementById('ident-number').value.trim();
  if(!name || !cls || !number){
    setState({identityError:'Fill in your name, class, and number to start.'}); return;
  }
  const t = DATA.tests[state.takingTestId];
  const settings = testSettings(t);
  if(!settings.allowRetake){
    const already = testSubmissions(state.takingTestId).some(s=>
      s.studentName.trim().toLowerCase()===name.toLowerCase() &&
      s.studentClass.trim().toLowerCase()===cls.toLowerCase() &&
      s.studentNumber.trim().toLowerCase()===number.toLowerCase()
    );
    if(already){
      setState({identityError:'You already completed this test — retakes are turned off.'}); return;
    }
  }
  const questions = settings.shuffle ? shuffleArray(t.questions) : t.questions.slice();
  const deadline = settings.timeLimitMin>0 ? Date.now()+settings.timeLimitMin*60000 : null;
  setState({view:'take-test', takingAnswers:{}, takingPending:{}, takingIndex:0,
    takingIdentity:{name, cls, number}, identityError:'',
    takingQuestions:questions, takingDeadlineAt:deadline});
  if(deadline) startTestTimer();
}

function selectMcq(qIndex, optIndex){
  const a = Object.assign({}, state.takingAnswers, {[qIndex]:optIndex});
  setState({takingAnswers:a});
}
function selectTf(qIndex, val){
  const a = Object.assign({}, state.takingAnswers, {[qIndex]:val});
  setState({takingAnswers:a});
}
function matchClickLeft(qIndex, leftIdx){
  const pend = Object.assign({}, state.takingPending, {[qIndex]:leftIdx});
  setState({takingPending:pend});
}
function matchClickRight(qIndex, rightIdx){
  const pendLeft = state.takingPending[qIndex];
  if(pendLeft===undefined) return;
  const pairs = (state.takingAnswers[qIndex] || []).filter(p=>p.left!==pendLeft && p.right!==rightIdx);
  pairs.push({left:pendLeft, right:rightIdx});
  const a = Object.assign({}, state.takingAnswers, {[qIndex]:pairs});
  const pend = Object.assign({}, state.takingPending);
  delete pend[qIndex];
  setState({takingAnswers:a, takingPending:pend});
}

function goToQuestion(i){ setState({takingIndex:i}); }

async function submitTest(){
  clearTestTimer();
  const test = DATA.tests[state.takingTestId];
  const settings = testSettings(test);
  const questions = (state.takingQuestions && state.takingQuestions.length) ? state.takingQuestions : test.questions;
  let score = 0;
  const total = questions.length;
  const detail = [];
  questions.forEach((q, i)=>{
    const ans = state.takingAnswers[i];
    let correct = false;
    if(q.type==='mcq') correct = ans===q.correct;
    else if(q.type==='tf') correct = ans===q.correct;
    else if(q.type==='match'){
      const pairs = ans || [];
      correct = pairs.length===q.terms.length && pairs.every(p=>p.left===p.right);
    } else if(q.type==='short'){
      const accepted = (q.accepted||[]).map(a=>a.trim().toLowerCase()).filter(Boolean);
      correct = accepted.includes(String(ans||'').trim().toLowerCase());
    } else if(q.type==='long'){
      correct = null; // needs manual grading by the teacher
    }
    if(correct===true) score++;
    detail.push({question:q, answer:ans, correct});
  });
  const subId = uid('sub');
  DATA.submissions[subId] = {
    testId: state.takingTestId,
    studentName: state.takingIdentity.name,
    studentClass: state.takingIdentity.cls,
    studentNumber: state.takingIdentity.number,
    score, total, detail,
    submittedAt: Date.now()
  };
  await saveData();
  if(settings.showResults){
    setState({view:'test-result', resultSubmissionId:subId});
  } else {
    setState({view:'test-submitted-notice', resultSubmissionId:subId});
  }
}

async function gradeLongAnswer(subId, qIndex, isCorrect){
  const sub = DATA.submissions[subId];
  if(!sub) return;
  const was = sub.detail[qIndex].correct;
  sub.detail[qIndex].correct = isCorrect;
  if(was!==true && isCorrect===true) sub.score++;
  if(was===true && isCorrect===false) sub.score--;
  await saveData();
  render();
  toast(isCorrect ? 'Marked correct' : 'Marked incorrect');
}

  if(q.type==='short'){
    return `<div class="qcard">
      <button class="remove-q" onclick="removeBuilderQuestion(${idx})">Remove ✕</button>
      <span class="qtype-badge short">Short answer</span>
      <div class="field"><label>Question ${idx+1}</label>
        <input type="text" value="${esc(q.text)}" oninput="updateBuilderQuestion(${idx},{text:this.value})">
      </div>
      ${q.accepted.map((a,ai)=>`
        <div class="opt-row">
          <input type="text" placeholder="Accepted answer ${ai+1}" value="${esc(a)}" oninput="(function(){const qs=state.builderQuestions;const acc=qs[${idx}].accepted.slice();acc[${ai}]=this.value;qs[${idx}]=Object.assign({},qs[${idx}],{accepted:acc});}).call(this)">
          ${q.accepted.length>1 ? `<button class="btn btn-outline btn-sm" onclick="(function(){const qs=state.builderQuestions;const acc=qs[${idx}].accepted.slice();acc.splice(${ai},1);qs[${idx}]=Object.assign({},qs[${idx}],{accepted:acc});render();})()">✕</button>` : ''}
        </div>
      `).join('')}
      <button class="btn btn-outline btn-sm" onclick="(function(){const qs=state.builderQuestions;const acc=qs[${idx}].accepted.slice();acc.push('');qs[${idx}]=Object.assign({},qs[${idx}],{accepted:acc});render();})()">+ Add alternate answer</button>
      <div class="meta" style="margin-top:8px;">Graded automatically — matches any accepted answer, not case-sensitive.</div>
    </div>`;
  }
  if(q.type==='long'){
    return `<div class="qcard">
      <button class="remove-q" onclick="removeBuilderQuestion(${idx})">Remove ✕</button>
      <span class="qtype-badge long">Long answer</span>
      <div class="field"><label>Question ${idx+1}</label>
        <input type="text" value="${esc(q.text)}" oninput="updateBuilderQuestion(${idx},{text:this.value})">
      </div>
      <div class="field" style="margin-bottom:4px;"><label>Model answer (optional — for your reference only)</label>
        <textarea rows="2" oninput="updateBuilderQuestion(${idx},{modelAnswer:this.value})">${esc(q.modelAnswer||'')}</textarea>
      </div>
      <div class="meta">Students type a written response — you grade these by hand after they submit.</div>
    </div>`;
  }
  return `<div class="qcard">
    <button class="remove-q" onclick="removeBuilderQuestion(${idx})">Remove ✕</button>
    <span class="qtype-badge match">Matching</span>
    <div class="field"><label>Instructions</label>
      <input type="text" value="${esc(q.text)}" oninput="updateBuilderQuestion(${idx},{text:this.value})">
    </div>
    <div class="meta" style="margin-bottom:8px;">Each term lines up with the definition next to it — students will see the definitions shuffled.</div>
    ${q.terms.map((term,ti)=>`
      <div class="opt-row">
        <input type="text" placeholder="Term ${ti+1}" value="${esc(term)}" style="flex:1" oninput="(function(){const qs=state.builderQuestions;const t=qs[${idx}].terms.slice();t[${ti}]=this.value;qs[${idx}]=Object.assign({},qs[${idx}],{terms:t});}).call(this)">
        <span style="color:var(--muted);">↔</span>
        <input type="text" placeholder="Definition ${ti+1}" value="${esc(q.defs[ti])}" style="flex:1" oninput="(function(){const qs=state.builderQuestions;const d=qs[${idx}].defs.slice();d[${ti}]=this.value;qs[${idx}]=Object.assign({},qs[${idx}],{defs:d});}).call(this)">
        ${q.terms.length>2 ? `<button class="btn btn-outline btn-sm" onclick="(function(){const qs=state.builderQuestions;const t=qs[${idx}].terms.slice();const d=qs[${idx}].defs.slice();t.splice(${ti},1);d.splice(${ti},1);qs[${idx}]=Object.assign({},qs[${idx}],{terms:t,defs:d});render();})()">✕</button>` : ''}
      </div>
    `).join('')}
    <button class="btn btn-outline btn-sm" onclick="(function(){const qs=state.builderQuestions;const t=qs[${idx}].terms.slice();const d=qs[${idx}].defs.slice();t.push('');d.push('');qs[${idx}]=Object.assign({},qs[${idx}],{terms:t,defs:d});render();})()">+ Add pair</button>
  </div>`;
}

function renderTeacherResults(){
  const t = Object.assign({id:state.resultsTestId}, DATA.tests[state.resultsTestId]);
  if(!t.title) return `<p>Test not found.</p>`;
  const subs = testSubmissions(t.id).sort((a,b)=>b.submittedAt-a.submittedAt);
  return `
  <button class="back-link" onclick="setState({view:'subject-detail', activeSubjectId:'${t.subjectId}', activeSubjectTab:'tests'})">← Back to subject</button>
  <div class="page-head"><h1>${esc(t.title)} — results</h1></div>
  ${subs.length===0 ? `<div class="empty-state">No one has submitted this test yet.</div>` : `
  <table class="results-table">
    <thead><tr><th>Name</th><th>Class</th><th>Number</th><th>Score</th><th>Percent</th><th></th></tr></thead>
    <tbody>
      ${subs.map(s=>{
        const pendingCount = s.detail.filter(d=>d.correct===null).length;
        const gradedTotal = s.total - pendingCount;
        const pctLabel = pendingCount>0 ? 'Needs review' : (gradedTotal>0 ? Math.round((s.score/gradedTotal)*100)+'%' : '—');
        return `<tr>
          <td>${esc(s.studentName)}</td><td>${esc(s.studentClass)}</td><td>${esc(s.studentNumber)}</td>
          <td>${s.score} / ${s.total}</td><td>${pctLabel}</td>
          <td><button class="btn btn-outline btn-sm" onclick="setState({view:'test-result', resultSubmissionId:'${s.id}'})">Review</button></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`}
  `;
}

function renderTakeTest(){
  const t = DATA.tests[state.takingTestId];
  if(!t) return `<p>Test not found.</p>`;
  const questions = (state.takingQuestions && state.takingQuestions.length) ? state.takingQuestions : t.questions;
  const i = state.takingIndex;
  const q = questions[i];
  const total = questions.length;
  const answered = state.takingAnswers[i]!==undefined;

  let qBody = '';
  if(q.type==='mcq'){
    qBody = q.options.map((opt,oi)=>`
      <div class="choice-row ${state.takingAnswers[i]===oi?'selected':''}" onclick="selectMcq(${i},${oi})">
        <span>${esc(opt)}</span>
      </div>
    `).join('');
  } else if(q.type==='tf'){
    qBody = `
      <div class="choice-row ${state.takingAnswers[i]===true?'selected':''}" onclick="selectTf(${i},true)">True</div>
      <div class="choice-row ${state.takingAnswers[i]===false?'selected':''}" onclick="selectTf(${i},false)">False</div>
    `;
  } else if(q.type==='match'){
    if(!state._shuffleCache) state._shuffleCache = {};
    const cacheKey = state.takingTestId+'-'+i;
    if(!state._shuffleCache[cacheKey]){
      const order = q.defs.map((_,idx)=>idx);
      for(let k=order.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [order[k],order[j]]=[order[j],order[k]]; }
      state._shuffleCache[cacheKey]=order;
    }
    const order = state._shuffleCache[cacheKey];
    const pairs = state.takingAnswers[i] || [];
    const pendLeft = state.takingPending[i];
    qBody = `
      <div class="match-wrap" id="match-wrap-${i}">
        <svg class="match-svg" id="match-svg-${i}"></svg>
        <div class="match-col">
          ${q.terms.map((term,ti)=>{
            const isPaired = pairs.some(p=>p.left===ti);
            const isPending = pendLeft===ti;
            return `<div class="match-item left ${isPaired?'paired':''} ${isPending?'pending':''}" data-side="left" data-idx="${ti}" onclick="matchClickLeft(${i},${ti})">${esc(term)}</div>`;
          }).join('')}
        </div>
        <div class="match-col">
          ${order.map(ri=>{
            const isPaired = pairs.some(p=>p.right===ri);
            return `<div class="match-item right ${isPaired?'paired':''}" data-side="right" data-idx="${ri}" onclick="matchClickRight(${i},${ri})">${esc(q.defs[ri])}</div>`;
          }).join('')}
        </div>
      </div>
      <div class="meta" style="margin-top:10px;">Click a term, then click its matching definition to connect them.</div>
    `;
  } else if(q.type==='short'){
    const val = state.takingAnswers[i] || '';
    qBody = `
      <div class="field">
        <input type="text" placeholder="Type your answer" value="${esc(val)}"
          oninput="updateTextAnswer(${i}, this.value)" onblur="render()">
      </div>`;
  } else if(q.type==='long'){
    const val = state.takingAnswers[i] || '';
    qBody = `
      <div class="field">
        <textarea rows="6" placeholder="Write your answer"
          oninput="updateTextAnswer(${i}, this.value)" onblur="render()">${esc(val)}</textarea>
      </div>`;
  }

  let canSubmitQ;
  if(q.type==='match') canSubmitQ = (state.takingAnswers[i]||[]).length===q.terms.length;
  else if(q.type==='short' || q.type==='long') canSubmitQ = !!(state.takingAnswers[i] && String(state.takingAnswers[i]).trim());
  else canSubmitQ = answered;

  return `
  <button class="back-link" onclick="exitTakeTest()">← Exit test</button>
  <div class="page-head"><h1>${esc(t.title)}</h1></div>
  ${state.takingDeadlineAt ? `<div class="meta" style="margin-bottom:12px;">⏱ Time remaining: <span id="test-timer" class="mono">${formatCountdown(state.takingDeadlineAt-Date.now())}</span></div>` : ''}
  <div class="progress-track">
    ${questions.map((_,qi)=>`<div class="seg ${state.takingAnswers[qi]!==undefined?'done':''}"></div>`).join('')}
  </div>
  <div class="meta" style="margin-bottom:6px;">Question ${i+1} of ${total}</div>
  <div class="q-text">${esc(q.text)}</div>
  ${qBody}
  <div style="display:flex;justify-content:space-between;margin-top:22px;">
    <button class="btn btn-outline" ${i===0?'disabled':''} onclick="goToQuestion(${i-1})">← Previous</button>
    ${i<total-1
      ? `<button class="btn btn-primary" ${canSubmitQ?'':'disabled'} onclick="goToQuestion(${i+1})">Next →</button>`
      : `<button class="btn btn-primary" ${canSubmitQ?'':'disabled'} onclick="submitTest()">Submit test</button>`}
  </div>
  `;
}

function drawMatchLines(){
  document.querySelectorAll('[id^="match-wrap-"]').forEach(wrap=>{
    const qi = wrap.id.replace('match-wrap-','');
    const svg = document.getElementById('match-svg-'+qi);
    if(!svg) return;
    const wrapRect = wrap.getBoundingClientRect();
    svg.setAttribute('width', wrapRect.width);
    svg.setAttribute('height', wrapRect.height);
    svg.innerHTML='';
    const pairs = state.takingAnswers[qi] || [];
    pairs.forEach(p=>{
      const leftEl = wrap.querySelector(`.match-item.left[data-idx="${p.left}"]`);
      const rightEl = wrap.querySelector(`.match-item.right[data-idx="${p.right}"]`);
      if(!leftEl||!rightEl) return;
      const lr = leftEl.getBoundingClientRect(), rr = rightEl.getBoundingClientRect();
      const x1 = lr.right - wrapRect.left, y1 = lr.top + lr.height/2 - wrapRect.top;
      const x2 = rr.left - wrapRect.left, y2 = rr.top + rr.height/2 - wrapRect.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1);
      line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      line.setAttribute('stroke','#3B6EA5'); line.setAttribute('stroke-width','2');
      line.setAttribute('stroke-dasharray','5,4');
      svg.appendChild(line);
    });
  });
}

function renderTestSubmittedNotice(){
  return `
  <div class="auth-wrap">
    <div class="card" style="text-align:center;">
      <h2>Test submitted ✅</h2>
      <p class="meta">Your answers have been recorded. Your teacher will share your results.</p>
      <button class="btn btn-primary btn-full" onclick="setState({view:'student-subject'})">Back to subject</button>
    </div>
  </div>`;
}

function renderTestResult(){
  const sub = DATA.submissions[state.resultSubmissionId];
  if(!sub) return `<p>Result not found.</p>`;
  const t = DATA.tests[sub.testId];
  const pendingCount = sub.detail.filter(d=>d.correct===null).length;
  const gradedTotal = sub.total - pendingCount;
  const pct = gradedTotal>0 ? Math.round((sub.score/gradedTotal)*100) : null;
  const backView = state.role==='teacher' ? 'teacher-results' : 'student-subject';
  return `
  <button class="back-link" onclick="setState({view:'${backView}', resultsTestId: '${sub.testId}'})">← Back</button>
  <div class="page-head"><h1>${esc(t.title)}</h1></div>
  ${sub.studentName ? `<div class="meta" style="margin:-14px 0 18px;">${esc(sub.studentName)} · ${esc(sub.studentClass)} · No. ${esc(sub.studentNumber)}</div>` : ''}
  <div class="score-hero">
    <div class="num">${sub.score}<span>/${sub.total}</span></div>
    <div class="meta" style="margin-top:6px;">${pct===null ? 'Awaiting grading' : pct+'% correct'}${pendingCount>0 ? ` · ${pendingCount} response${pendingCount===1?'':'s'} awaiting review` : ''}</div>
  </div>
  ${sub.detail.map((d,i)=>{
    const preview = answerPreview(d.question, d.answer);
    const isPending = d.correct===null;
    const tagLabel = isPending ? 'Awaiting review' : (d.correct?'Correct':'Incorrect');
    const rowClass = isPending ? 'pending' : (d.correct?'correct':'incorrect');
    return `
    <div class="review-row ${rowClass}">
      <div class="tag">${tagLabel} · Question ${i+1}</div>
      <div style="margin-top:4px;font-weight:600;">${esc(d.question.text)}</div>
      <div class="meta" style="margin-top:4px;">Answer: ${esc(preview)}</div>
      ${d.question.type==='long' && d.question.modelAnswer && state.role==='teacher' ? `<div class="meta" style="margin-top:2px;">Model answer: ${esc(d.question.modelAnswer)}</div>` : ''}
      ${isPending && state.role==='teacher' ? `
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button class="btn btn-outline btn-sm" onclick="gradeLongAnswer('${state.resultSubmissionId}',${i},true)">Mark correct</button>
          <button class="btn btn-outline btn-sm" onclick="gradeLongAnswer('${state.resultSubmissionId}',${i},false)">Mark incorrect</button>
        </div>` : ''}
    </div>`;
  }).join('')}
  `;
}

  document.getElementById('app').innerHTML = '<main><p style="text-align:center;padding:60px;color:#818979;">Loading…</p></main>';
  await loadData();
  render();
})();
</script>

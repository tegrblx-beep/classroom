<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chalkline — Classrooms &amp; Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk-dark:#2F4538;
    --chalk-darker:#223228;
    --paper:#F7F4EC;
    --paper-dim:#EFEAD9;
    --ink:#26302A;
    --marker-blue:#3B6EA5;
    --marker-blue-dim:#e7eef5;
    --marker-red:#C6503E;
    --marker-red-dim:#f7e9e6;
    --marker-yellow:#D89B2E;
    --marker-yellow-dim:#faf0dc;
    --marker-purple:#7A5FA3;
    --marker-purple-dim:#efe9f5;
    --marker-teal:#2E8B84;
    --marker-teal-dim:#e3f3f1;
    --muted:#818979;
    --line:#D8D2C0;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    font-size:15px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--chalk-darker);
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}

  .topbar{
    background:var(--chalk-dark);
    color:var(--paper);
    padding:14px 28px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk';font-weight:700;font-size:18px;color:#fff;}
  .brand .dot-line{display:inline-flex;gap:3px;}
  .brand .dot-line span{width:5px;height:5px;border-radius:50%;background:var(--marker-yellow);display:inline-block;}
  .topbar .who{font-size:13px;color:#cfd8cd;display:flex;align-items:center;gap:14px;}
  .topbar button.link{background:none;border:1px solid rgba(255,255,255,0.35);color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;}
  .topbar button.link:hover{background:rgba(255,255,255,0.12);}

  main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:34px 24px 80px;}

  .crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:14px;}
  .crumbs button{background:none;border:none;color:var(--muted);font-size:13px;padding:0;font-weight:600;}
  .crumbs button:hover{color:var(--marker-blue);}
  .crumbs .sep{color:var(--line);}
  .crumbs .current{color:var(--ink);font-weight:600;}

  .landing-hero{text-align:center;padding:60px 20px 20px;}
  .landing-hero h1{font-size:44px;margin:0 0 10px;}
  .landing-hero p{color:var(--muted);font-size:16px;max-width:480px;margin:0 auto 36px;}
  .portal-choice{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
  .portal-card{
    background:#fff;border:1px solid var(--line);border-radius:16px;
    padding:32px 30px;width:260px;text-align:left;transition:transform .15s ease, box-shadow .15s ease;
  }
  .portal-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(47,69,56,0.12);}
  .portal-card .icon{font-size:26px;margin-bottom:10px;}
  .portal-card h3{margin:0 0 6px;font-size:19px;}
  .portal-card p{color:var(--muted);font-size:13.5px;margin:0 0 18px;}
  .portal-card button{width:100%;}

  .btn{
    border:none;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;justify-content:center;
  }
  .btn-primary{background:var(--chalk-dark);color:#fff;}
  .btn-primary:hover{background:var(--chalk-darker);}
  .btn-blue{background:var(--marker-blue);color:#fff;}
  .btn-blue:hover{opacity:.9;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--chalk-dark);}
  .btn-danger{background:var(--marker-red-dim);color:var(--marker-red);}
  .btn-danger:hover{background:#f2d9d4;}
  .btn-sm{padding:6px 12px;font-size:12.5px;border-radius:7px;}
  .btn-full{width:100%;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .auth-wrap{max-width:380px;margin:20px auto;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;}
  .card h2{margin-top:0;font-size:21px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .field input,.field select,.field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--marker-blue);outline-offset:1px;border-color:var(--marker-blue);}
  .auth-switch{text-align:center;margin-top:14px;font-size:13.5px;color:var(--muted);}
  .auth-switch button{background:none;border:none;color:var(--marker-blue);font-weight:600;text-decoration:underline;padding:0;}
  .error-msg{background:var(--marker-red-dim);color:var(--marker-red);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;}
  .back-link{background:none;border:none;color:var(--muted);font-size:13.5px;margin-bottom:18px;display:inline-flex;align-items:center;gap:5px;}
  .back-link:hover{color:var(--ink);}

  .page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-head h1{font-size:26px;margin:0;}
  .empty-state{border:1.5px dashed var(--line);border-radius:14px;padding:44px 20px;text-align:center;color:var(--muted);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;}
  .tile.clickable{cursor:pointer;transition:box-shadow .15s ease, transform .15s ease;}
  .tile.clickable:hover{box-shadow:0 8px 18px rgba(47,69,56,0.1);transform:translateY(-2px);}
  .tile h3{margin:0 0 4px;font-size:17px;}
  .tile .meta{color:var(--muted);font-size:12.5px;margin-bottom:12px;}
  .tile .subject-icon{font-size:22px;margin-bottom:8px;}
  .code-pill{
    display:inline-flex;align-items:center;gap:6px;background:var(--marker-yellow-dim);color:#8a6412;
    font-family:'JetBrains Mono';font-weight:700;padding:4px 10px;border-radius:7px;font-size:13px;letter-spacing:.04em;
  }
  .tile-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}

  .dot-rule{
    height:1px;background-image:repeating-linear-gradient(90deg, var(--line) 0 6px, transparent 6px 12px);
    margin:10px 0;
  }
  .list-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;gap:10px;}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;}
  .tabs button{background:none;border:none;padding:10px 4px;margin-right:22px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;}
  .tabs button.active{color:var(--chalk-darker);border-bottom-color:var(--marker-blue);}

  .material-row{display:flex;align-items:center;gap:12px;padding:13px 0;}
  .material-icon{
    width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    font-size:17px;flex-shrink:0;
  }
  .material-icon.slides{background:var(--marker-red-dim);}
  .material-icon.doc{background:var(--marker-blue-dim);}
  .material-icon.video{background:var(--marker-purple-dim);}
  .material-icon.link{background:var(--marker-yellow-dim);}
  .material-info{flex:1;min-width:0;}
  .material-info .mtitle{font-weight:600;font-size:14.5px;}
  .material-info .mdesc{color:var(--ink);opacity:0.75;font-size:13px;margin-top:2px;line-height:1.4;}
  .material-info .murl{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .material-type-select{display:flex;gap:8px;flex-wrap:wrap;}
  .type-chip{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;background:#fff;color:var(--muted);}
  .type-chip.active{border-color:var(--marker-blue);color:var(--marker-blue);background:var(--marker-blue-dim);}

  .qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;position:relative;}
  .qcard .qtype-badge{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:10px;margin-right:6px;
  }
  .qtype-badge.mcq{background:var(--marker-blue-dim);color:var(--marker-blue);}
  .qtype-badge.tf{background:var(--marker-yellow-dim);color:#8a6412;}
  .qtype-badge.match{background:var(--marker-red-dim);color:var(--marker-red);}
  .qtype-badge.short{background:var(--marker-purple-dim);color:var(--marker-purple);}
  .qtype-badge.long{background:var(--paper-dim);color:var(--muted);}
  .qtype-badge.msq{background:var(--marker-teal-dim);color:var(--marker-teal);}
  .qtype-badge.order{background:var(--marker-red-dim);color:var(--marker-red);}
  .qtype-badge.numeric{background:var(--marker-purple-dim);color:var(--marker-purple);}
  .qtype-badge.manual{background:var(--marker-yellow-dim);color:#8a6412;}
  .qtype-badge.cloze{background:var(--marker-blue-dim);color:var(--marker-blue);}
  .qtype-badge.dropdowncloze{background:var(--marker-teal-dim);color:var(--marker-teal);}
  .qtype-badge.categorize{background:var(--marker-purple-dim);color:var(--marker-purple);}
  .qtype-badge.stateset{background:var(--marker-yellow-dim);color:#8a6412;}
  .qtype-badge.rating{background:var(--paper-dim);color:var(--muted);}
  .qtype-badge.rubric{background:var(--marker-red-dim);color:var(--marker-red);}
  .qtype-badge.code{background:var(--marker-blue-dim);color:var(--marker-blue);}
  .qtype-badge.fileupload{background:var(--marker-teal-dim);color:var(--marker-teal);}
  .qtype-badge.allocation{background:var(--marker-purple-dim);color:var(--marker-purple);}
  .qtype-badge.audio{background:var(--marker-yellow-dim);color:#8a6412;}
  .rating-row{display:flex;gap:8px;margin:10px 0;}
  .rating-opt{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:9px;padding:14px 6px;cursor:pointer;background:#fff;font-weight:700;}
  .rating-opt.selected{border-color:var(--marker-blue);background:var(--marker-blue-dim);color:var(--marker-blue);}
  .rec-btn{display:inline-flex;align-items:center;gap:8px;}
  .rec-dot{width:10px;height:10px;border-radius:50%;background:var(--marker-red);display:inline-block;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
  .qcard .remove-q{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:13px;}
  .qcard .remove-q:hover{color:var(--marker-red);}
  .opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .opt-row input[type=text]{flex:1;}
  .add-q-bar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0;}
  .manual-grade-toggle{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}

  /* ---- rich text toolbar (essay / rubric answers) ---- */
  .rte-toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:4px;
    background:var(--paper-dim);border:1px solid var(--line);border-bottom:none;
    border-radius:9px 9px 0 0;padding:7px 8px;
  }
  .rte-sep{width:1px;align-self:stretch;background:var(--line);margin:2px 3px;}
  .rte-select{
    border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:12.5px;
    background:#fff;color:var(--ink);max-width:120px;
  }
  .rte-btn{
    background:#fff;border:1px solid var(--line);border-radius:6px;
    min-width:28px;height:28px;padding:0 6px;font-size:13px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;color:var(--ink);
  }
  .rte-btn:hover{border-color:var(--marker-blue);color:var(--marker-blue);}
  .rte-btn.active{border-color:var(--marker-blue);background:var(--marker-blue-dim);color:var(--marker-blue);}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:0.82em;line-height:1.15;margin:0 2px;}
  .frac .fracnum{border-bottom:1.4px solid currentColor;padding:0 3px;}
  .frac .fracden{padding:0 3px;}
  .sqrt{white-space:nowrap;}
  .sqrt .rad{border-top:1.4px solid currentColor;padding:2px 3px 0;margin-left:1px;}
  .rte-color-label{
    display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff;
  }
  .rte-color-input{
    width:18px;height:18px;padding:0;border:none;background:none;cursor:pointer;
  }
  .rte-editor{
    min-height:150px;border:1px solid var(--line);border-radius:0 0 9px 9px;
    padding:12px 14px;background:#fff;font-size:14px;line-height:1.6;color:var(--ink);
    outline:none;
  }
  .rte-editor:focus{outline:2px solid var(--marker-blue);outline-offset:-1px;border-color:var(--marker-blue);}
  .rte-editor:empty:before{content:attr(data-placeholder);color:var(--muted);}
  .rte-editor ul,.rte-content ul{margin:6px 0 6px 22px;}
  .rte-editor ol,.rte-content ol{margin:6px 0 6px 22px;}
  .rte-editor h1,.rte-content h1{font-size:22px;margin:10px 0 6px;}
  .rte-editor h2,.rte-content h2{font-size:19px;margin:8px 0 6px;}
  .rte-editor h3,.rte-content h3{font-size:16px;margin:8px 0 4px;}

  .progress-track{display:flex;gap:5px;margin-bottom:24px;}
  .progress-track .seg{height:5px;flex:1;background:var(--line);border-radius:3px;}
  .progress-track .seg.done{background:var(--chalk-dark);}
  .q-text{font-size:18px;font-weight:600;margin-bottom:16px;color:var(--chalk-darker);}
  .choice-row{
    display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:10px;background:#fff;
  }
  .choice-row.selected{border-color:var(--marker-blue);background:var(--marker-blue-dim);}
  .choice-row:hover{cursor:pointer;border-color:var(--marker-blue);}

  .order-item{
    display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;margin-bottom:8px;background:#fff;
  }
  .order-item .order-idx{
    font-family:'JetBrains Mono';font-weight:700;color:var(--muted);width:20px;flex-shrink:0;
  }
  .order-item .order-text{flex:1;}
  .order-item .order-btns{display:flex;gap:4px;flex-shrink:0;}
  .order-item .order-btns button{
    border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:28px;font-size:13px;
  }
  .order-item .order-btns button:disabled{opacity:.3;cursor:not-allowed;}
  .order-item .order-btns button:hover:not(:disabled){border-color:var(--marker-blue);color:var(--marker-blue);}

  .match-wrap{position:relative;display:flex;justify-content:space-between;gap:60px;padding:10px 0;}
  .match-col{flex:1;display:flex;flex-direction:column;gap:10px;}
  .match-item{
    border:1.5px solid var(--line);border-radius:9px;padding:11px 14px;background:#fff;font-size:14px;
    cursor:pointer;position:relative;
  }
  .match-item.left{text-align:left;}
  .match-item.right{text-align:right;}
  .match-item.pending{border-color:var(--marker-yellow);background:var(--marker-yellow-dim);}
  .match-item.paired{border-color:var(--marker-blue);}
  .match-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}

  .score-hero{text-align:center;padding:34px 20px;background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:24px;}
  .score-hero .num{font-family:'Space Grotesk';font-size:52px;font-weight:700;color:var(--chalk-dark);}
  .score-hero .num span{font-size:22px;color:var(--muted);font-weight:500;}
  .review-row{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
  .review-row.correct{border-left:4px solid #4f8f5f;}
  .review-row.incorrect{border-left:4px solid var(--marker-red);}
  .review-row.pending{border-left:4px solid var(--marker-yellow);}
  .review-row .tag{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);}
  .settings-check{display:flex;align-items:center;gap:8px;text-transform:none;font-weight:500;color:var(--ink);font-size:14px;}

  table.results-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  table.results-table th,table.results-table td{padding:11px 14px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line);}
  table.results-table th{background:var(--paper-dim);color:var(--muted);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.04em;}
  table.results-table tr:last-child td{border-bottom:none;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--chalk-darker);color:#fff;padding:11px 20px;border-radius:9px;font-size:13.5px;
    box-shadow:0 8px 22px rgba(0,0,0,.2);z-index:50;
  }
  .confirm-overlay{
    position:fixed;inset:0;background:rgba(38,48,42,0.45);display:flex;align-items:center;justify-content:center;
    z-index:60;padding:20px;
  }
  .confirm-box{background:#fff;border-radius:14px;padding:24px;max-width:360px;width:100%;box-shadow:0 14px 34px rgba(0,0,0,.22);}
  .confirm-box p{margin:0 0 18px;font-size:15px;color:var(--ink);}
  .confirm-actions{display:flex;justify-content:flex-end;gap:10px;}

  .due-pill{
    display:inline-flex;align-items:center;gap:6px;background:var(--marker-purple-dim);color:var(--marker-purple);
    font-weight:700;padding:4px 10px;border-radius:7px;font-size:12px;
  }
  .due-pill.overdue{background:var(--marker-red-dim);color:var(--marker-red);}
  .announce-card{
    background:var(--marker-yellow-dim);border:1px solid #ecd9a8;border-radius:12px;
    padding:14px 16px;margin-bottom:10px;position:relative;
  }
  .announce-card .atext{font-size:14px;color:var(--ink);white-space:pre-wrap;line-height:1.5;padding-right:26px;}
  .announce-card .ameta{font-size:11.5px;color:#8a6412;margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .announce-card .remove-ann{position:absolute;top:12px;right:14px;background:none;border:none;color:#8a6412;font-size:13px;}
  .announce-card .remove-ann:hover{color:var(--marker-red);}
  .submission-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;}
  .grade-badge{
    display:inline-flex;align-items:center;font-weight:700;padding:3px 9px;border-radius:7px;font-size:12.5px;
    background:#e5f1e7;color:#3d7a4a;
  }
  .grade-badge.pending{background:var(--marker-yellow-dim);color:#8a6412;}
  @media(max-width:640px){
    .match-wrap{gap:24px;}
    .landing-hero h1{font-size:32px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DATA LAYER
   Hierarchy: classroom (e.g. 7A) -> subjects (e.g. English,
   Math) -> materials (links/slides/docs) + tests + projects.
   Everything shared so teacher + student views see one world.
   NOTE: passwords are stored in plain text — fine for a
   prototype, not for a real deployment with real students.
   ========================================================= */
const DATA_KEY = 'chalkline-data-v3';
let DATA = null;

/* ---- IndexedDB storage layer ----
   localStorage caps out around 5-10MB total per site, which was too
   tight once files/photos got attached. IndexedDB scales with disk
   space instead (typically hundreds of MB to a few GB), so we use it
   as the primary store. Any data saved under the old localStorage
   key is migrated in automatically the first time this loads, and if
   IndexedDB is ever unavailable we fall back to localStorage so the
   app still works. */
const IDB_NAME = 'chalkline-db';
const IDB_STORE = 'kv';
let idbPromise = null;

function openIdb(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB not available')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = function(e){
      const db = e.target.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
    };
    req.onsuccess = function(e){ resolve(e.target.result); };
    req.onerror = function(e){ reject(e.target.error || new Error('IndexedDB open failed')); };
  });
  return idbPromise;
}
function idbGet(key){
  return openIdb().then(db=>new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  }));
}
function idbSet(key, value){
  return openIdb().then(db=>new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    const req = tx.objectStore(IDB_STORE).put(value, key);
    req.onsuccess = ()=>resolve();
    req.onerror = ()=>reject(req.error);
  }));
}

async function loadData(){
  let stored = null;
  try{
    stored = await idbGet(DATA_KEY);
    if(!stored){
      // one-time migration from the old localStorage-based version
      try{
        const raw = localStorage.getItem(DATA_KEY);
        if(raw){
          stored = JSON.parse(raw);
          await idbSet(DATA_KEY, stored);
          localStorage.removeItem(DATA_KEY);
        }
      }catch(e){ /* no legacy data to migrate, ignore */ }
    }
  }catch(e){
    // IndexedDB unavailable — fall back to localStorage
    try{
      const raw = localStorage.getItem(DATA_KEY);
      stored = raw ? JSON.parse(raw) : null;
    }catch(e2){ /* ignore, fall through to blank */ }
  }
  DATA = stored || blankData();
  const b = blankData();
  Object.keys(b).forEach(k=>{ if(!DATA[k]) DATA[k]=b[k]; });
}

async function saveData(){
  try{
    await idbSet(DATA_KEY, DATA);
  }catch(e){
    try{
      localStorage.setItem(DATA_KEY, JSON.stringify(DATA));
    }catch(e2){
      toast('Could not save — your browser storage may be full');
    }
  }
}

}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalizeUrl(url){
  const u = (url||'').trim();
  if(!u) return '';
  if(/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u)) return u; // already has a scheme (http:, https:, mailto:, etc.)
  return 'https://' + u;
}

function shuffleArray(arr){
  const a = arr.slice();
  for(let k=a.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [a[k],a[j]]=[a[j],a[k]]; }
  return a;
}
function answerPreview(q, ans){
  if(q.type==='mcq') return (ans!=null && q.options[ans]!==undefined) ? q.options[ans] : '(no answer)';
  if(q.type==='tf') return ans===true ? 'True' : ans===false ? 'False' : '(no answer)';
  if(q.type==='match') return (ans && ans.length) ? ans.map(p=>`${q.terms[p.left]} → ${q.defs[p.right]}`).join('; ') : '(no answer)';
  if(q.type==='short' || q.type==='code') return (ans && String(ans).trim()) ? ans : '(no answer)';
  if(q.type==='long' || q.type==='rubric') return (ans && stripHtml(ans)) ? stripHtml(ans) : '(no answer)';
  if(q.type==='msq') return (ans && ans.length) ? ans.map(oi=>q.options[oi]).join(', ') : '(no answer)';
  if(q.type==='order') return (ans && ans.length) ? ans.map(ii=>q.items[ii]).join(' → ') : '(no answer)';
  if(q.type==='numeric') return (ans!==undefined && ans!==null && String(ans).trim()!=='') ? String(ans) : '(no answer)';
  if(q.type==='cloze') return (ans && ans.length) ? ans.map((v,bi)=>`Blank ${bi+1}: ${v||'(blank)'}`).join('; ') : '(no answer)';
  if(q.type==='dropdowncloze') return (ans && ans.length) ? ans.map((v,bi)=>`Blank ${bi+1}: ${v||'(blank)'}`).join('; ') : '(no answer)';
  if(q.type==='categorize') return (ans && ans.length) ? q.items.map((it,ii)=>`${it.label}: ${ans[ii]!==undefined ? (q.categories[ans[ii]]||'?') : '(none)'}`).join('; ') : '(no answer)';
  if(q.type==='stateset') return (ans && ans.length) ? q.statements.map((st,si)=>`${st.text}: ${ans[si]===true?'True':ans[si]===false?'False':'(none)'}`).join('; ') : '(no answer)';
  if(q.type==='rating') return (ans!==undefined && ans!==null) ? String(ans) : '(no answer)';
  if(q.type==='allocation') return (ans && Object.keys(ans).length) ? q.items.map((it,ii)=>`${it.label}: ${ans[ii]!==undefined?ans[ii]:'0'}`).join('; ') : '(no answer)';
  if(q.type==='fileupload' || q.type==='audio') return (ans && ans.dataUrl) ? (ans.name || 'Attached') : '(no answer)';
  return '';
}
function formatFileSize(bytes){
  if(bytes==null) return '';
  if(bytes < 1024) return bytes + ' B';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(2) + ' MB';
}
function formatDueDate(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function isPastDue(dateStr){
  if(!dateStr) return false;
  const d = new Date(dateStr + 'T23:59:59');
  return !isNaN(d.getTime()) && Date.now() > d.getTime();
}

  else if(type==='short') q = {type:'short', text:'', accepted:[''], manualGrade:false, maxPoints:1};
  else if(type==='msq') q = {type:'msq', text:'', options:['','',''], correct:[0], manualGrade:false, maxPoints:1};
  else if(type==='order') q = {type:'order', text:'', items:['','',''], manualGrade:false, maxPoints:1};
  else if(type==='numeric') q = {type:'numeric', text:'', answer:0, tolerance:0, manualGrade:false, maxPoints:1};
  else if(type==='cloze') q = {type:'cloze', text:'Paris is the capital of ___.', blanks:[{accepted:'Paris'}], manualGrade:false, maxPoints:1};
  else if(type==='dropdowncloze') q = {type:'dropdowncloze', text:'Paris is the capital of ___.', blanks:[{options:'France, Spain, Italy', correct:'France'}], manualGrade:false, maxPoints:1};
  else if(type==='categorize') q = {type:'categorize', text:'Sort each item into the correct category', categories:['Category A','Category B'], items:[{label:'', correctCategory:0}], manualGrade:false, maxPoints:1};
  else if(type==='stateset') q = {type:'stateset', text:'Mark each statement True or False', statements:[{text:'', correct:true}], manualGrade:false, maxPoints:1};
  else if(type==='rating') q = {type:'rating', text:'', scaleMin:1, scaleMax:5, minLabel:'Not confident', maxLabel:'Very confident', manualGrade:true, maxPoints:1};
  else if(type==='rubric') q = {type:'rubric', text:'', criteria:[{label:'Content', points:10}], manualGrade:true, maxPoints:1};
  else if(type==='code') q = {type:'code', text:'', starterCode:'', manualGrade:true, maxPoints:1};
  else if(type==='fileupload') q = {type:'fileupload', text:'', manualGrade:true, maxPoints:1};
  else if(type==='allocation') q = {type:'allocation', text:'Distribute the total across these items', items:[{label:'', target:50, tolerance:5}, {label:'', target:50, tolerance:5}], total:100, manualGrade:false, maxPoints:1};
  else if(type==='audio') q = {type:'audio', text:'', manualGrade:true, maxPoints:1};
  else q = {type:'long', text:'', modelAnswer:'', maxPoints:1};

async function saveTest(){
  const title = document.getElementById('builder-title-input').value.trim();
  if(!title){ toast('Give the test a title first'); return; }
  if(state.builderQuestions.length===0){ toast('Add at least one question'); return; }
  for(const q of state.builderQuestions){
    if(!q.text || !q.text.trim()){ toast('Every question needs its text filled in'); return; }
    if(q.type==='mcq' && q.options.some(o=>!o.trim())){ toast('Fill in every answer choice'); return; }
    if(q.type==='match' && (q.terms.some(t=>!t.trim()) || q.defs.some(d=>!d.trim()))){ toast('Fill in every term and definition'); return; }
    if(q.type==='short' && !(q.accepted||[]).some(a=>a.trim())){ toast('Give at least one accepted answer for each short-answer question'); return; }
    if(q.type==='msq'){
      if(q.options.some(o=>!o.trim())){ toast('Fill in every answer choice'); return; }
      if(!q.correct || q.correct.length===0){ toast('Mark at least one correct choice for each multi-select question'); return; }
    }
    if(q.type==='order' && q.items.some(t=>!t.trim())){ toast('Fill in every item for each ordering question'); return; }
    if(q.type==='numeric' && (q.answer===undefined || q.answer===null || isNaN(parseFloat(q.answer)))){ toast('Give a numeric answer for each numeric question'); return; }
    if(q.type==='cloze' && q.blanks.some(b=>!b.accepted || !b.accepted.trim())){ toast('Fill in an accepted answer for every blank'); return; }
    if(q.type==='dropdowncloze' && q.blanks.some(b=>!b.options || !b.options.trim() || !b.correct || !b.correct.trim())){ toast('Fill in the choices and correct answer for every blank'); return; }
    if(q.type==='categorize'){
      if(q.categories.some(c=>!c.trim())){ toast('Fill in every category name'); return; }
      if(q.items.some(it=>!it.label.trim())){ toast('Fill in every item to sort'); return; }
    }
    if(q.type==='stateset' && q.statements.some(s=>!s.text.trim())){ toast('Fill in every statement'); return; }
    if(q.type==='rubric' && q.criteria.some(c=>!c.label.trim() || c.points===undefined || c.points===null || isNaN(parseFloat(c.points)))){ toast('Fill in a label and points for every rubric criterion'); return; }
    if(q.type==='allocation'){

/* =========================================================
   RICH TEXT EDITOR (Google-Docs-style toolbar for essay /
   rubric long-answer responses). Uses execCommand on a
   contenteditable div — fine for this prototype's scope.
   ========================================================= */
function stripHtml(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html || '';
  return (tmp.textContent || tmp.innerText || '').trim();
}

/* ---- selection save/restore ----
   Only needed for controls that MUST steal native browser focus to
   work at all (a <select> dropdown, a native <input type=color>
   picker) — that focus change would otherwise drop the text
   selection the command is supposed to act on. Plain toolbar
   buttons avoid this entirely (see renderRichToolbar) by
   preventing the mousedown default, so focus never leaves the
   editor for them in the first place — that's the more reliable
   path and why they no longer misfire. */
let rteSavedRange = null;
let rteSavedQIndex = null;
let rteStyleWithCssReady = false;
function rteSaveSelection(qIndex){
  const editor = document.getElementById('rte-'+qIndex);
  if(!editor) return;
  const sel = window.getSelection();
  if(sel && sel.rangeCount>0 && editor.contains(sel.anchorNode)){
    rteSavedRange = sel.getRangeAt(0).cloneRange();
  } else {
    // editor was never focused yet (e.g. first click lands on the toolbar) —
    // fall back to placing the cursor at the end of whatever's there.
    const r = document.createRange();
    r.selectNodeContents(editor);
    r.collapse(false);
    rteSavedRange = r;
  }
  rteSavedQIndex = qIndex;
}
function rteFocusAndRestore(qIndex){
  const el = document.getElementById('rte-'+qIndex);
  if(!el) return;
  el.focus();
  if(rteSavedRange && rteSavedQIndex===qIndex){
    const sel = window.getSelection();
    sel.removeAllRanges();
    try{ sel.addRange(rteSavedRange); }catch(e){ /* stale range, ignore */ }
  }
}
function ensureStyleWithCss(){
  // Without this, foreColor/hiliteColor are unreliable (or no-ops) in
  // several browsers — it makes execCommand write real CSS instead of
  // legacy <font>/<strike> tags.
  if(rteStyleWithCssReady) return;
  try{ document.execCommand('styleWithCSS', false, true); rteStyleWithCssReady = true; }catch(e){}
}
function richInput(qIndex, el){
  state.takingAnswers = Object.assign({}, state.takingAnswers, {[qIndex]: el.innerHTML});
}
function richAfterCommand(qIndex){
  const el = document.getElementById('rte-'+qIndex);
  if(el) richInput(qIndex, el);
  richUpdateToolbarState(qIndex);
}
/* Plain toolbar button (bold, italic, align, lists, superscript,
   clear formatting…). Focus never left the editor — mousedown on the
   button was prevented — so this just runs the command directly on
   whatever's currently selected (or, if the selection is collapsed,
   it toggles the style for text typed from here on — that's native
   execCommand behavior). */
function richCommand(qIndex, cmd, val){
  ensureStyleWithCss();
  try{ document.execCommand(cmd, false, val || null); }catch(e){ /* unsupported command, ignore */ }
  richAfterCommand(qIndex);
}
/* Variant for controls that DID need to steal focus (paragraph-style
   select, symbol select) — reclaims the editor and the saved
   selection first. */
function richCommandFromControl(qIndex, cmd, val){
  rteFocusAndRestore(qIndex);
  richCommand(qIndex, cmd, val);
}
function richColorCommand(qIndex, cmd, val){
  rteFocusAndRestore(qIndex);
  ensureStyleWithCss();
  let ok = false;
  try{ ok = document.execCommand(cmd, false, val); }catch(e){ ok = false; }
  if(!ok && cmd==='hiliteColor'){
    try{ document.execCommand('backColor', false, val); }catch(e){}
  }
  richAfterCommand(qIndex);
}
function richInsertHtml(qIndex, html){
  ensureStyleWithCss();
  try{ document.execCommand('insertHTML', false, html); }catch(e){}
  richAfterCommand(qIndex);
}
function richInsertSymbol(qIndex, selectEl){
  const sym = selectEl.value;
  if(sym){
    rteFocusAndRestore(qIndex);
    richInsertHtml(qIndex, esc(sym));
  }
  selectEl.value = '';
}
function richInsertFraction(qIndex){
  richInsertHtml(qIndex, '<span class="frac">&#8203;<span class="fracnum">a</span><span class="fracden">b</span></span>&#8203; ');
}
function richInsertSqrt(qIndex){

/* ---- toolbar "pressed" state (bold/italic/... highlighted while active) ---- */
function richUpdateToolbarState(qIndex){
  const toolbar = document.querySelector('.rte-toolbar[data-for="'+qIndex+'"]');
  if(!toolbar) return;
  ['bold','italic','underline','strikeThrough','insertUnorderedList','insertOrderedList',
   'justifyLeft','justifyCenter','justifyRight','justifyFull','superscript','subscript'].forEach(cmd=>{
    const btn = toolbar.querySelector('[data-cmd="'+cmd+'"]');
    if(!btn) return;
    let active = false;
    try{ active = document.queryCommandState(cmd); }catch(e){ active = false; }
    btn.classList.toggle('active', !!active);
  });
  const select = toolbar.querySelector('.rte-select');
  if(select){
    let block = '';
    try{ block = (document.queryCommandValue('formatBlock')||'').toLowerCase(); }catch(e){}
    select.value = (block==='h1'||block==='h2'||block==='h3') ? block : 'p';
  }
}
// Keep toolbar button states in sync as the cursor moves (click, arrow keys, etc).
document.addEventListener('selectionchange', function(){
  const sel = window.getSelection();
  if(!sel || sel.rangeCount===0 || !sel.anchorNode) return;
  const node = sel.anchorNode;
  const el = node.nodeType===1 ? node : node.parentElement;
  const editor = el && el.closest ? el.closest('.rte-editor') : null;
  if(!editor) return;
  richUpdateToolbarState(editor.id.replace('rte-',''));
});

const RTE_SYMBOLS = ['√','π','±','×','÷','≤','≥','≠','≈','∞','°','∑','∫','½','¼','¾','²','³'];
function renderRichToolbar(qIndex){
  // Plain command buttons: preventDefault on mousedown/pointerdown so
  // the button never steals focus from the editor — the native text
  // selection (or cursor position) is left completely untouched, which
  // is what makes these reliably apply to the selection, or — with a
  // collapsed cursor and no selection — toggle formatting for whatever
  // you type next, exactly like Google Docs.
  const btn = (cmd, label, title)=>`<button type="button" class="rte-btn" data-cmd="${cmd}" title="${title}"
      onmousedown="event.preventDefault()" onpointerdown="event.preventDefault()"
      onclick="richCommand(${qIndex},'${cmd}')">${label}</button>`;
  const actionBtn = (fn, label, title)=>`<button type="button" class="rte-btn" title="${title}"
      onmousedown="event.preventDefault()" onpointerdown="event.preventDefault()"
      onclick="${fn}(${qIndex})">${label}</button>`;
  return `
  <div class="rte-toolbar" data-for="${qIndex}">
    <select class="rte-select" title="Paragraph style"
      onmousedown="rteSaveSelection(${qIndex})"
      onchange="richCommandFromControl(${qIndex},'formatBlock',this.value);this.blur();">
      <option value="p">Normal text</option>
      <option value="h1">Heading 1</option>
      <option value="h2">Heading 2</option>
      <option value="h3">Heading 3</option>
    </select>
    <span class="rte-sep"></span>
    ${btn('bold','<b>B</b>','Bold')}
    ${btn('italic','<i>I</i>','Italic')}
    ${btn('underline','<u>U</u>','Underline')}
    ${btn('strikeThrough','<s>S</s>','Strikethrough')}
    <span class="rte-sep"></span>
    ${btn('justifyLeft','≡◧','Align left')}
    ${btn('justifyCenter','≡','Align center')}
    ${btn('justifyRight','◨≡','Align right')}
    ${btn('justifyFull','☰','Justify')}
    <span class="rte-sep"></span>
    ${btn('insertUnorderedList','• ≡','Bulleted list')}
    ${btn('insertOrderedList','1.≡','Numbered list')}
    <span class="rte-sep"></span>
    <label class="rte-color-label" title="Text color">A
      <input type="color" class="rte-color-input" value="#26302a"
        onmousedown="rteSaveSelection(${qIndex})"
        onchange="richColorCommand(${qIndex},'foreColor',this.value)">
    </label>
    <label class="rte-color-label" title="Highlight color">🖌
      <input type="color" class="rte-color-input" value="#faf0dc"
        onmousedown="rteSaveSelection(${qIndex})"
        onchange="richColorCommand(${qIndex},'hiliteColor',this.value)">
    </label>
    <span class="rte-sep"></span>
    ${btn('superscript','x²','Superscript')}
    ${btn('subscript','x₂','Subscript')}
    ${actionBtn('richInsertFraction','a⁄b','Insert fraction')}
    ${actionBtn('richInsertSqrt','√x','Insert square root')}
    <select class="rte-select" title="Insert math symbol" style="max-width:56px;"
      onmousedown="rteSaveSelection(${qIndex})" onchange="richInsertSymbol(${qIndex}, this)">
      <option value="">Symbol…</option>
      ${RTE_SYMBOLS.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('')}
    </select>
    <span class="rte-sep"></span>
    ${btn('removeFormat','Tx','Clear formatting (select text first)')}
  </div>`;
}

/* ---- audio response recording ---- */
let audioRecorder = null;
let audioChunks = [];
let audioRecordingQIndex = null;
async function startAudioRecording(qIndex){
  if(!navigator.mediaDevices || !window.MediaRecorder){
    toast('Your browser does not support audio recording');
    return;
  }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    audioChunks = [];
    audioRecorder = new MediaRecorder(stream);
    audioRecorder.ondataavailable = e=>{ if(e.data.size>0) audioChunks.push(e.data); };
    audioRecorder.onstop = function(){
      stream.getTracks().forEach(tr=>tr.stop());
      const blob = new Blob(audioChunks, {type: audioRecorder.mimeType || 'audio/webm'});
      const reader = new FileReader();
      reader.onload = function(){
        const a = Object.assign({}, state.takingAnswers, {[qIndex]:{dataUrl:reader.result, size:blob.size}});
        audioRecordingQIndex = null;
        setState({takingAnswers:a});
      };
      reader.readAsDataURL(blob);
    };
    audioRecorder.start();
    audioRecordingQIndex = qIndex;
    render();
  }catch(e){
    toast('Could not access the microphone — check your browser permissions');
  }
}
function stopAudioRecording(){
  if(audioRecorder && audioRecorder.state!=='inactive') audioRecorder.stop();
}

async function submitTest(){
  clearTestTimer();
  const test = DATA.tests[state.takingTestId];
  const settings = testSettings(test);
  const questions = (state.takingQuestions && state.takingQuestions.length) ? state.takingQuestions : test.questions;
  let score = 0;
  let totalPoints = 0;
  const detail = [];
  questions.forEach((q, i)=>{
    const ans = state.takingAnswers[i];
    const maxPoints = q.maxPoints || 1;
    totalPoints += maxPoints;
    let correct = false;
    let earnedPoints = 0;
    if(q.type==='long' || q.manualGrade){
      correct = null; // needs manual grading by the teacher
      earnedPoints = null;
    } else if(q.type==='mcq'){
      correct = ans===q.correct;
    } else if(q.type==='tf'){
      correct = ans===q.correct;
    } else if(q.type==='match'){
      const pairs = ans || [];
      correct = pairs.length===q.terms.length && pairs.every(p=>p.left===p.right);
    } else if(q.type==='short'){
      const accepted = (q.accepted||[]).map(a=>a.trim().toLowerCase()).filter(Boolean);
      correct = accepted.includes(String(ans||'').trim().toLowerCase());
    } else if(q.type==='msq'){
      const given = (ans||[]).slice().sort((a,b)=>a-b);
      const want = (q.correct||[]).slice().sort((a,b)=>a-b);
      correct = given.length===want.length && given.every((v,idx)=>v===want[idx]);
    } else if(q.type==='order'){
      const identity = q.items.map((_,idx)=>idx);
      correct = !!ans && ans.length===identity.length && ans.every((v,idx)=>v===identity[idx]);
    } else if(q.type==='numeric'){
      const val = parseFloat(ans);
      correct = !isNaN(val) && Math.abs(val - parseFloat(q.answer)) <= (parseFloat(q.tolerance)||0);
    } else if(q.type==='cloze'){
      const a = ans || [];
      correct = q.blanks.every((b,bi)=>{
        const accepted = (b.accepted||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
        return accepted.includes(String(a[bi]||'').trim().toLowerCase());
      });
    } else if(q.type==='dropdowncloze'){
      const a = ans || [];
      correct = q.blanks.every((b,bi)=> String(a[bi]||'').trim() === String(b.correct||'').trim());
    } else if(q.type==='categorize'){
      const a = ans || [];
      correct = q.items.every((it,ii)=> a[ii]===it.correctCategory);
    } else if(q.type==='stateset'){
      const a = ans || [];
      correct = q.statements.every((st,si)=> a[si]===st.correct);
    } else if(q.type==='allocation'){
      const a = ans || {};
      correct = q.items.every((it,ii)=>{
        const val = parseFloat(a[ii]);
        return !isNaN(val) && Math.abs(val - parseFloat(it.target)) <= (parseFloat(it.tolerance)||0);
      });
    }
    if(correct===true){
      earnedPoints = maxPoints;
      score += maxPoints;
    }
    detail.push({question:q, answer:ans, correct, earnedPoints, maxPoints});
  });
  const subId = uid('sub');
  DATA.submissions[subId] = {
    testId: state.takingTestId,
    studentName: state.takingIdentity.name,
    studentClass: state.takingIdentity.cls,
    studentNumber: state.takingIdentity.number,
    score, totalPoints, detail,
    submittedAt: Date.now()
  };
  await saveData();
  if(settings.showResults){
    setState({view:'test-result', resultSubmissionId:subId});
  } else {
    setState({view:'test-submitted-notice', resultSubmissionId:subId});
  }
}

async function gradeLongAnswer(subId, qIndex, isCorrect){
  const sub = DATA.submissions[subId];
  if(!sub) return;
  const was = sub.detail[qIndex].correct;
  const earnedPoints = sub.detail[qIndex].earnedPoints;
  const maxPoints = sub.detail[qIndex].maxPoints || 1;
  sub.detail[qIndex].correct = isCorrect;
  if(was!==true && isCorrect===true){
    sub.detail[qIndex].earnedPoints = maxPoints;
    sub.score += maxPoints;
  }
  if(was===true && isCorrect===false){
    sub.detail[qIndex].earnedPoints = 0;
    sub.score -= maxPoints;
  }
  await saveData();
  render();
  toast(isCorrect ? 'Marked correct' : 'Marked incorrect');
}

async function updateQuestionPoints(subId, qIndex){
  const input = document.getElementById('points-input-'+qIndex);
  if(!input) return;
  const newPoints = parseFloat(input.value);
  const sub = DATA.submissions[subId];
  if(!sub) return;
  const maxPoints = sub.detail[qIndex].maxPoints || 1;
  if(isNaN(newPoints) || newPoints < 0 || newPoints > maxPoints){
    toast('Enter points between 0 and ' + maxPoints);
    return;
  }
  const oldPoints = sub.detail[qIndex].earnedPoints !== null ? sub.detail[qIndex].earnedPoints : 0;
  sub.detail[qIndex].earnedPoints = newPoints;
  sub.score = sub.score - oldPoints + newPoints;
  if(newPoints === maxPoints) sub.detail[qIndex].correct = true;
  else if(newPoints === 0) sub.detail[qIndex].correct = false;
  else sub.detail[qIndex].correct = null; // partial credit
  await saveData();
  render();
  toast('Points updated');
}

async function overrideSubmissionScore(subId){
  const input = document.getElementById('score-override-input');
  if(!input) return;
  const val = parseFloat(input.value);
  if(isNaN(val) || val<0 || val>100){ toast('Enter a valid percentage between 0 and 100'); return; }
  const sub = DATA.submissions[subId];
  if(!sub) return;
  sub.score = (val / 100) * sub.totalPoints;
  sub.scoreOverridePercentage = val;
  sub.scoreOverridden = true;
  await saveData();
  render();
  toast('Final score updated');
}

function getStudentGrades(studentId, subjectId){
  const tests = subjectTests(subjectId);
  const grades = [];
  tests.forEach(t=>{
    const subs = testSubmissions(t.id).filter(s=>
      s.studentName && DATA.students[studentId] &&
      s.studentName.trim().toLowerCase()===DATA.students[studentId].name.toLowerCase() &&
      s.studentClass.trim().toLowerCase()===DATA.students[studentId].className.toLowerCase() &&
      s.studentNumber.trim().toLowerCase()===DATA.students[studentId].number.toLowerCase()
    );
    if(subs.length>0){
      const latest = subs.sort((a,b)=>b.submittedAt-a.submittedAt)[0];
      const pct = latest.totalPoints>0 ? Math.round((latest.score/latest.totalPoints)*100) : 0;
      grades.push({testTitle:t.title, score:latest.score, totalPoints:latest.totalPoints, percent:pct});
    }
  });
  return grades;
}

/* =========================================================
   FLASHCARDS
   ========================================================= */
function testFlashcards(testId){
  const test = DATA.tests[testId];
  if(!test) return [];
  return test.questions.map((q,idx)=>({
    question: q.text,
    answer: getFlashcardAnswer(q),
    type: q.type,
    index: idx
  }));
}

function getFlashcardAnswer(q){
  if(q.type==='mcq') return q.options[q.correct];
  if(q.type==='tf') return q.correct ? 'True' : 'False';
  if(q.type==='short') return (q.accepted||[]).join(' or ');
  if(q.type==='numeric') return q.answer + (q.tolerance ? ' (±'+q.tolerance+')' : '');
  if(q.type==='match') return q.terms.map((t,i)=>t+' → '+q.defs[i]).join('; ');
  return 'See answer in test';
}

/* =========================================================
   CALENDAR & EVENTS
   ========================================================= */
function classroomCalendarEvents(classroomId){
  const events = [];
  const c = DATA.classrooms[classroomId];
  if(!c) return events;

  const subjects = classroomSubjects(classroomId);
  subjects.forEach(s=>{
    subjectTests(s.id).forEach(t=>{ if(t.dueDate) events.push({title:t.title+' (Test)',date:t.dueDate,type:'test'}); });
    subjectMaterials(s.id).forEach(m=>{ if(m.dueDate) events.push({title:m.title+' (Material)',date:m.dueDate,type:'material'}); });
    subjectAssignments(s.id).forEach(a=>{ if(a.dueDate) events.push({title:a.title+' (Assignment)',date:a.dueDate,type:'assignment'}); });
  });
  subjectProjects(state.activeSubjectId||'').forEach(p=>{ if(p.dueDate) events.push({title:p.title+' (Project)',date:p.dueDate,type:'project'}); });
  classroomHomework(classroomId).forEach(h=>{ if(h.dueDate) events.push({title:h.title+' (Homework)',date:h.dueDate,type:'homework'}); });

  return events.sort((a,b)=>new Date(a.date)-new Date(b.date));
}

/* =========================================================
   ANALYTICS & STATISTICS
   ========================================================= */
function getClassAnalytics(classroomId){
  const students = classroomStudents(classroomId);
  const subjects = classroomSubjects(classroomId);

  let totalTests = 0;
  let averageScore = 0;
  let testCount = 0;
  let attendanceRate = 0;
  let totalDays = 0;
  let presentDays = 0;

  students.forEach(s=>{
    subjects.forEach(subj=>{
      const grades = getStudentGrades(s.id, subj.id);
      grades.forEach(g=>{
        averageScore += g.percent;
        testCount++;
      });
    });
  });

  const history = getAttendanceHistory(classroomId);
  history.forEach(h=>{
    totalDays += Object.keys(h.records).length;
    presentDays += Object.values(h.records).filter(r=>r==='present'||r==='late').length;
  });

  subjects.forEach(s=>{ totalTests += subjectTests(s.id).length; });

  return {
    studentCount: students.length,
    subjectCount: subjects.length,
    totalTests,
    averageScore: testCount>0 ? Math.round(averageScore/testCount) : 0,
    attendanceRate: totalDays>0 ? Math.round((presentDays/totalDays)*100) : 0
  };
}

    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" onclick="openAttendance('${c.id}')">📋 Attendance</button>
      <button class="btn btn-primary btn-sm" onclick="openGradebook('${c.id}')">📊 Gradebook</button>
      <button class="btn btn-danger btn-sm" onclick="askConfirm('Delete this class and everything in it?', ()=>deleteClassroom('${c.id}'))">Delete class</button>

  <h3 style="margin:0 0 10px;font-size:16px;">Announcements</h3>
  <div class="card" style="margin-bottom:16px;max-width:520px;">
    <div class="field" style="margin-bottom:10px;"><label>Post an announcement</label>
      <textarea id="new-announcement-text" rows="2" placeholder="e.g. Test moved to Friday"></textarea>
    </div>
    <button class="btn btn-primary" onclick="postAnnouncement()">Post</button>
  </div>
  ${announcements.length>0 ? `
  <div style="margin-bottom:26px;max-width:520px;">
    ${announcements.map(a=>`
      <div class="announce-card">
        <button class="remove-ann" onclick="askConfirm('Delete this announcement?', ()=>deleteAnnouncement('${a.id}'))">✕</button>
        <div class="atext">${esc(a.text)}</div>
        <div class="ameta">${new Date(a.createdAt).toLocaleString()}</div>
      </div>
    `).join('')}
  </div>` : `<div class="empty-state" style="margin-bottom:26px;">No announcements yet.</div>`}

  <h3 style="margin:0 0 10px;font-size:16px;">Subjects</h3>
  <div class="card" style="margin-bottom:20px;max-width:420px;">
    <div class="field" style="margin-bottom:10px;"><label>New subject</label>
      <input id="new-subject-name" type="text" placeholder="e.g. English, Math, Science">
    </div>
    <button class="btn btn-primary" onclick="createSubject()">Add subject</button>
  </div>
  ${subjects.length===0 ? `<div class="empty-state">No subjects yet — add English, Math, or any subject this class takes.</div>` : `
  <div class="grid">
    ${subjects.map(s=>{
      const matCount = subjectMaterials(s.id).length;
      const testCount = subjectTests(s.id).length;
      const projCount = subjectProjects(s.id).length;
      return `
      <div class="tile clickable" onclick="openSubject('${s.id}')">
        <div class="subject-icon">📚</div>
        <h3>${esc(s.name)}</h3>
        <div class="meta">${matCount} material${matCount===1?'':'s'} · ${testCount} test${testCount===1?'':'s'} · ${projCount} project${projCount===1?'':'s'}</div>
      </div>`;
    }).join('')}
  </div>`}`;
}

function renderSubjectDetail(){
  const s = Object.assign({id:state.activeSubjectId}, DATA.subjects[state.activeSubjectId]);
  if(!s.name) return `<p>Subject not found.</p>`;
  const c = DATA.classrooms[s.classroomId];
  const tab = state.activeSubjectTab;
  const materials = subjectMaterials(s.id);
  const tests = subjectTests(s.id);
  const projects = subjectProjects(s.id);
  return `
  <div class="crumbs">
    <button onclick="setState({view:'teacher-dashboard'})">Your classes</button>
    <span class="sep">/</span>
    <button onclick="setState({view:'classroom-detail', activeClassroomId:'${s.classroomId}'})">${esc(c?c.name:'')}</button>
    <span class="sep">/</span>
    <span class="current">${esc(s.name)}</span>
  </div>
  <div class="page-head">
    <h1>${esc(s.name)}</h1>
    <button class="btn btn-danger btn-sm" onclick="askConfirm('Delete this subject and everything in it?', ()=>deleteSubject('${s.id}'))">Delete subject</button>
  </div>
  <div class="tabs">
    <button class="${tab==='materials'?'active':''}" onclick="setState({activeSubjectTab:'materials'})">Materials (${materials.length})</button>
    <button class="${tab==='tests'?'active':''}" onclick="setState({activeSubjectTab:'tests'})">Tests (${tests.length})</button>
    <button class="${tab==='projects'?'active':''}" onclick="setState({activeSubjectTab:'projects'})">Projects (${projects.length})</button>
  </div>
  ${tab==='materials' ? `
    <div class="card" style="margin-bottom:20px;max-width:480px;">
      <div class="field" style="margin-bottom:8px;"><label>Type</label>
        <div class="material-type-select">
          ${MATERIAL_TYPES.map(t=>`<button type="button" class="type-chip ${state.newMaterialType===t.id?'active':''}" onclick="state.newMaterialType='${t.id}';render();">${t.icon} ${t.label}</button>`).join('')}
        </div>
      </div>
      <div class="field" style="margin-bottom:8px;"><label>Title</label>
        <input id="material-title" type="text" placeholder="e.g. Unit 3 Slides">
      </div>
      <div class="field" style="margin-bottom:8px;"><label>Description</label>
        <textarea id="material-desc" rows="2" placeholder="What is this material about?"></textarea>
      </div>
      <div class="field" style="margin-bottom:8px;"><label>Link (optional — Teams, Drive, YouTube, anywhere)</label>
        <input id="material-url" type="text" placeholder="https://...">
      </div>
      <div class="field" style="margin-bottom:4px;"><label>Or attach a file (optional, max 50MB)</label>
        <input id="material-file" type="file" onchange="handleMaterialFileChange(this)">
      </div>
      ${state.newMaterialFile ? `<div class="meta" style="margin-bottom:10px;">Selected: ${esc(state.newMaterialFile.name)} (${formatFileSize(state.newMaterialFile.size)})</div>` : `<div class="meta" style="margin-bottom:10px;">Link and file are both optional — add either, both, or neither.</div>`}
      <button class="btn btn-primary" onclick="addMaterial()">Add to subject</button>
    </div>
    ${materials.length===0 ? `<div class="empty-state">No materials yet — add slides, documents, or links for students to study from.</div>` : `
    <div class="card">
      ${materials.map((m,i)=>{
        const ti = materialTypeInfo(m.type);
        return `
        ${i>0?'<div class="dot-rule"></div>':''}
        <div class="material-row">
          <div class="material-icon ${m.type}">${ti.icon}</div>
          <div class="material-info">
            <div class="mtitle">${esc(m.title)}</div>
            ${m.description ? `<div class="mdesc">${esc(m.description)}</div>` : ''}
            ${m.url ? `<div class="murl">${esc(m.url)}</div>` : ''}
          </div>
          ${m.url ? `<a href="${esc(normalizeUrl(m.url))}" target="_blank" rel="noopener"><button class="btn btn-outline btn-sm">Open</button></a>` : ''}
          ${m.fileData ? `<a href="${m.fileData}" download="${esc(m.fileName)}"><button class="btn btn-outline btn-sm">⬇ ${esc(m.fileName)}</button></a>` : ''}
          <button class="btn btn-danger btn-sm" onclick="deleteMaterial('${m.id}')">Remove</button>
        </div>`;
      }).join('')}
    </div>`}
  ` : tab==='tests' ? `
    <div style="margin-bottom:16px;">
      <button class="btn btn-primary" onclick="startTestBuilder('${s.id}')">+ New test</button>
    </div>
    ${tests.length===0 ? `<div class="empty-state">No tests yet in ${esc(s.name)}.</div>` : `
    <div class="grid">
      ${tests.map(t=>`
        <div class="tile">
          <h3>${esc(t.title)}</h3>
          <div class="meta">${t.questions.length} question${t.questions.length===1?'':'s'} · ${testSubmissions(t.id).length} submission${testSubmissions(t.id).length===1?'':'s'}</div>
          <div class="tile-actions">
            <button class="btn btn-outline btn-sm" onclick="startTestBuilder('${s.id}','${t.id}')">Edit</button>
            <button class="btn btn-outline btn-sm" onclick="viewTestResults('${t.id}')">Results</button>
            <button class="btn btn-danger btn-sm" onclick="askConfirm('Delete this test?', ()=>deleteTest('${t.id}'))">Delete</button>
          </div>
        </div>
      `).join('')}
    </div>`}
  ` : `
    <div class="card" style="margin-bottom:20px;max-width:480px;">
      <div class="field" style="margin-bottom:8px;"><label>Title</label>
        <input id="project-title" type="text" placeholder="e.g. Science Fair Poster">
      </div>
      <div class="field" style="margin-bottom:8px;"><label>Description</label>
        <textarea id="project-desc" rows="3" placeholder="What should students do for this project?"></textarea>
      </div>
      <div class="field" style="margin-bottom:10px;"><label>Due date</label>
        <input id="project-due" type="date">
      </div>
      <button class="btn btn-primary" onclick="createProject()">Create project</button>
    </div>
    ${projects.length===0 ? `<div class="empty-state">No projects yet in ${esc(s.name)}.</div>` : `
    <div class="grid">
      ${projects.map(p=>{
        const subs = projectSubmissionsFor(p.id);
        const gradedCount = subs.filter(x=>x.grade!==null && x.grade!==undefined).length;
        const overdue = isPastDue(p.dueDate);
        return `
        <div class="tile">
          <h3>${esc(p.title)}</h3>
          ${p.description ? `<div class="meta" style="margin-bottom:6px;">${esc(p.description)}</div>` : ''}
          ${p.dueDate ? `<span class="due-pill ${overdue?'overdue':''}">Due ${esc(formatDueDate(p.dueDate))}</span>` : ''}
          <div class="meta" style="margin-top:8px;">${subs.length} submission${subs.length===1?'':'s'} · ${gradedCount} graded</div>
          <div class="tile-actions">
            <button class="btn btn-outline btn-sm" onclick="openProjectSubmissions('${p.id}')">Submissions</button>
            <button class="btn btn-danger btn-sm" onclick="askConfirm('Delete this project?', ()=>deleteProject('${p.id}'))">Delete</button>
          </div>
        </div>`;
      }).join('')}
    </div>`}
  `}`;
}

function renderTestBuilder(){
  const qs = state.builderQuestions;
  const s = DATA.subjects[state.builderSubjectId];
  const editingTest = state.editingTestId ? DATA.tests[state.editingTestId] : null;
  const settings = testSettings(editingTest);
  return `
  <button class="back-link" onclick="setState({view:'subject-detail', activeSubjectId:state.builderSubjectId, activeSubjectTab:'tests', editingTestId:null})">← Cancel</button>
  <div class="page-head"><h1>${editingTest?'Edit test':'New test'} ${s?('· '+esc(s.name)):''}</h1></div>
  <div class="card" style="margin-bottom:22px;max-width:500px;">
    <div class="field"><label>Test title</label>
      <input id="builder-title-input" type="text" placeholder="e.g. Chapter 4 Quiz" value="${esc(state.builderTitle)}" oninput="state.builderTitle=this.value">
    </div>
  </div>

  <div class="card" style="margin-bottom:22px;max-width:500px;">
    <h3 style="margin:0 0 12px;font-size:15px;">Test settings</h3>
    <div class="field" style="margin-bottom:10px;">
      <label class="settings-check"><input type="checkbox" id="builder-shuffle" ${settings.shuffle?'checked':''}> Shuffle question order for each student</label>

    </div>

      <label class="settings-check"><input type="checkbox" id="builder-showresults" ${settings.showResults?'checked':''}> Show results to students right after they submit</label>
    </div>
    <div class="field" style="margin-bottom:0;">
      <label class="settings-check"><input type="checkbox" id="builder-allowretake" ${settings.allowRetake?'checked':''}> Allow students to retake this test</label>

  ${qs.map((q,idx)=>renderBuilderQuestion(q, idx)).join('')}

    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('match')">+ Matching (connect the line)</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('order')">+ Ordering / sequence</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('numeric')">+ Numeric answer</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('short')">+ Short answer</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('long')">+ Long answer</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('cloze')">+ Fill in the blank</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('dropdowncloze')">+ Dropdown cloze</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('categorize')">+ Categorize / sort</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('stateset')">+ Statement set (T/F batch)</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('rating')">+ Rating scale</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('rubric')">+ Essay with rubric</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('code')">+ Code answer</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('fileupload')">+ File upload answer</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('allocation')">+ Point allocation</button>
    <button class="btn btn-outline btn-sm" onclick="addBuilderQuestion('audio')">+ Audio response</button>

function renderManualGradeToggle(idx, q){
  return `
  <div class="manual-grade-toggle">
    <label class="settings-check"><input type="checkbox" ${q.manualGrade?'checked':''} onchange="updateBuilderQuestion(${idx},{manualGrade:this.checked})"> Require manual grading (don't auto-grade, review each answer yourself)</label>
  </div>
  <div class="field" style="margin-top:10px;max-width:150px;">
    <label>Max points</label>
    <input type="number" min="1" step="1" value="${q.maxPoints||1}" oninput="updateBuilderQuestion(${idx},{maxPoints:parseFloat(this.value)||1})">
  </div>`;
}

function renderBuilderQuestion(q, idx){
  if(q.type==='mcq'){
    return `<div class="qcard">
      <button class="remove-q" onclick="removeBuilderQuestion(${idx})">Remove ✕</button>
      <span class="qtype-badge mcq">Multiple choice</span>${q.manualGrade?'<span class="qtype-badge manual">Manual grade</span>':''}
      <div class="field"><label>Question ${idx+1}</label>
        <input type="text" value="${esc(q.text)}" oninput="updateBuilderQuestion(${idx},{text:this.value})">
      </div>
      ${q.options.map((opt,oi)=>`
        <div class="opt-row">
          <input type="radio" name="correct-${idx}" ${q.correct===oi?'checked':''} onchange="updateBuilderQuestion(${idx},{correct:${oi}})">
          <input type="text" placeholder="Choice ${oi+1}" value="${esc(opt)}" oninput="(function(){const qs=state.builderQuestions;const o=qs[${idx}].options.slice();o[${oi}]=this.value;qs[${idx}]=Object.assign({},qs[${idx}],{options:o});}).call(this)">
          ${q.options.length>2 ? `<button class="btn btn-outline btn-sm" onclick="(function(){const qs=state.builderQuestions;const o=qs[${idx}].options.slice();o.splice(${oi},1);let c=qs[${idx}].correct; if(c>=o.length)c=0; qs[${idx}]=Object.assign({},qs[${idx}],{options:o,correct:c}); render();})()">✕</button>` : ''}
        </div>
      `).join('')}
      <button class="btn btn-outline btn-sm" onclick="(function(){const qs=state.builderQuestions;const o=qs[${idx}].options.slice();o.push('');qs[${idx}]=Object.assign({},qs[${idx}],{options:o});render();})()">+ Add choice</button>
      <div class="meta" style="margin-top:8px;">Select the radio button next to the correct answer.</div>
      ${renderManualGradeToggle(idx, q)}
    </div>`;
  }
  if(q.type==='msq'){
    return `<div class="qcard">
      <button class="remove-q" onclick="removeBuilderQuestion(${idx})">Remove ✕</button>
      <span class="qtype-badge msq">Multi-select</span>${q.manualGrade?'<span class="qtype-badge manual">Manual grade</span>':''}
      <div class="field"><label>Question ${idx+1}</label>
        <input type="text" value="${esc(q.text)}" oninput="updateBuilderQuestion(${idx},{text:this.value})">
      </div>
      ${q.options.map((opt,oi)=>`
        <div class="opt-row">
          <input type="checkbox" ${q.correct.includes(oi)?'checked':''} onchange="toggleMsqCorrect(${idx},${oi},this.checked)">
          <input type="text" placeholder="Choice ${oi+1}" value="${esc(opt)}" oninput="(function(){const qs=state.builderQuestions;const o=qs[${idx}].options.slice();o[${oi}]=this.value;qs[${idx}]=Object.assign({},qs[${idx}],{options:o});}).call(this)">
          ${q.options.length>2 ? `<button class="btn btn-outline btn-sm" onclick="(function(){const qs=state.builderQuestions;const o=qs[${idx}].options.slice();o.splice(${oi},1);const c=qs[${idx}].correct.filter(v=>v!==${oi}).map(v=>v>${oi}?v-1:v);qs[${idx}]=Object.assign({},qs[${idx}],{options:o,correct:c}); render();})()">✕</button>` : ''}
        </div>
      `).join('')}
      <button class="btn btn-outline btn-sm" onclick="(function(){const qs=state.builderQuestions;const o=qs[${idx}].options.slice();o.push('');qs[${idx}]=Object.assign({},qs[${idx}],{options:o});render();})()">+ Add choice</button>
      <div class="meta" style="margin-top:8px;">Check every correct choice — students must select all and only these to get it right.</div>
      ${renderManualGradeToggle(idx, q)}
    </div>`;
  }
  if(q.type==='tf'){
    return `<div class="qcard">
      <button class="remove-q" onclick="removeBuilderQuestion(${idx})">Remove ✕</button>
      <span class="qtype-badge tf">True / False</span>${q.manualGrade?'<span class="qtype-badge manual">Manual grade</span>':''}
      <div class="field"><label>Question ${idx+1}</label>
        <input type="text" value="${esc(q.text)}" oninput="updateBuilderQuestion(${idx},{text:this.value})">
      </div>
      <div class="opt-row">
        <label style="display:flex;align-items:center;gap:6px;"><input type="radio" name="tf-${idx}" ${q.correct===true?'checked':''} onchange="updateBuilderQuestion(${idx},{correct:true})"> True</label>
        <label style="display:flex;align-items:center;gap:6px;margin-left:18px;"><input type="radio" name="tf-${idx}" ${q.correct===false?'checked':''} onchange="updateBuilderQuestion(${idx},{correct:false})"> False</label>
      </div>
      ${renderManualGradeToggle(idx, q)}
    </div>`;
  }
  if(q.type==='numeric'){
    return `<div class="qcard">
      <button class="remove-q" onclick="removeBuilderQuestion(${idx})">Remove ✕</button>
      <span class="qtype-badge numeric">Numeric</span>${q.manualGrade?'<span class="qtype-badge manual">Manual grade</span>':''}
      <div class="field"><label>Question ${idx+1}</label>
        <input type="text" value="${esc(q.text)}" oninput="updateBuilderQuestion(${idx},{text:this.value})">
      </div>
      <div class="opt-row">
        <div class="field" style="margin-bottom:0;flex:1;"><label>Correct answer</label>
          <input type="number" step="any" value="${esc(q.answer)}" oninput="updateBuilderQuestion(${idx},{answer:this.value})">
        </div>
        <div class="field" style="margin-bottom:0;flex:1;"><label>Tolerance (± , optional)</label>
          <input type="number" step="any" min="0" value="${esc(q.tolerance||0)}" oninput="updateBuilderQuestion(${idx},{tolerance:this.value})">
        </div>
      </div>
      <div class="meta" style="margin-top:8px;">Graded automatically — accepts anything within the tolerance range.</div>
      ${renderManualGradeToggle(idx, q)}
    </div>`;
  }
  if(q.type==='short'){
    return `<div class="qcard">
      <button class="remove-q" onclick="removeBuilderQuestion(${idx})">Remove ✕</button>
      <span class="qtype-badge short">Short answer</span>${q.manualGrade?'<span class="qtype-badge manual">Manual grade</span>':''}
      <div class="field"><label>Question ${idx+1}</label>
        <input type="text" value="${esc(q.text)}" oninput="updateBuilderQuestion(${idx},{text:this.value})">
      </div>
      ${q.accepted.map((a,ai)=>`
        <div class="opt-row">
          <input type="text" placeholder="Accepted answer ${ai+1}" value="${esc(a)}" oninput="(function(){const qs=state.builderQuestions;const acc=qs[${idx}].accepted.slice();acc[${ai}]=this.value;qs[${idx}]=Object.assign({},qs[${idx}],{accepted:acc});}).call(this)">
          ${q.accepted.length>1 ? `<button class="btn btn-outline btn-sm" onclick="(function(){const qs=state.builderQuestions;const acc=qs[${idx}].accepted.slice();acc.splice(${ai},1);qs[${idx}]=Object.assign({},qs[${idx}],{accepted:acc});render();})()">✕</button>` : ''}
        </div>
      `).join('')}
      <button class="btn btn-outline btn-sm" onclick="(function(){const qs=state.builderQuestions;const acc=qs[${idx}].accepted.slice();acc.push('');qs[${idx}]=Object.assign({},qs[${idx}],{accepted:acc});render();})()">+ Add alternate answer</button>
      <div class="meta" style="margin-top:8px;">Graded automatically — matches any accepted answer, not case-sensitive. Turn on manual grading below if you'd rather review these yourself.</div>
      ${renderManualGradeToggle(idx, q)}
    </div>`;
  }
  if(q.type==='order'){
    return `<div class="qcard">
      <button class="remove-q" onclick="removeBuilderQuestion(${idx})">Remove ✕</button>
      <span class="qtype-badge order">Ordering</span>${q.manualGrade?'<span class="qtype-badge manual">Manual grade</span>':''}
      <div class="field"><label>Instructions</label>
        <input type="text" value="${esc(q.text)}" oninput="updateBuilderQuestion(${idx},{text:this.value})">
      </div>
      <div class="meta" style="margin-bottom:8px;">List the items in the correct order — students will see them shuffled and put them back in order.</div>
      ${q.items.map((item,ii)=>`
        <div class="opt-row">
          <span class="mono" style="width:18px;color:var(--muted);">${ii+1}.</span>
          <input type="text" placeholder="Item ${ii+1}" value="${esc(item)}" oninput="(function(){const qs=state.builderQuestions;const it=qs[${idx}].items.slice();it[${ii}]=this.value;qs[${idx}]=Object.assign({},qs[${idx}],{items:it});}).call(this)">
          ${q.items.length>2 ? `<button class="btn btn-outline btn-sm" onclick="(function(){const qs=state.builderQuestions;const it=qs[${idx}].items.slice();it.splice(${ii},1);qs[${idx}]=Object.assign({},qs[${idx}],{items:it});render();})()">✕</button>` : ''}
        </div>
      `).join('')}
      <button class="btn btn-outline btn-sm" onclick="(function(){const qs=state.builderQuestions;const it=qs[${idx}].items.slice();it.push('');qs[${idx}]=Object.assign({},qs[${idx}],{items:it});render();})()">+ Add item</button>
      ${renderManualGradeToggle(idx, q)}
    </div>`;
  }
  if(q.type==='long'){
    return `<div class="qcard">
      <button class="remove-q" onclick="removeBuilderQuestion(${idx})">Remove ✕</button>
      <span class="qtype-badge long">Long answer</span><span class="qtype-badge manual">Manual grade</span>
      <div class="field"><label>Question ${idx+1}</label>
        <input type="text" value="${esc(q.text)}" oninput="updateBuilderQuestion(${idx},{text:this.value})">
      </div>
      <div class="field" style="margin-bottom:4px;"><label>Model answer (optional — for your reference only)</label>
        <textarea rows="2" oninput="updateBuilderQuestion(${idx},{modelAnswer:this.value})">${esc(q.modelAnswer||'')}</textarea>
      </div>
      <div class="meta">Students type a written response — you grade these by hand after they submit.</div>
      <div class="field" style="margin-top:10px;max-width:150px;">

function renderTeacherResults(){
  const t = Object.assign({id:state.resultsTestId}, DATA.tests[state.resultsTestId]);
  if(!t.title) return `<p>Test not found.</p>`;
  const subs = testSubmissions(t.id).sort((a,b)=>b.submittedAt-a.submittedAt);
  return `
  <button class="back-link" onclick="setState({view:'subject-detail', activeSubjectId:'${t.subjectId}', activeSubjectTab:'tests'})">← Back to subject</button>
  <div class="page-head"><h1>${esc(t.title)} — results</h1></div>
  ${subs.length===0 ? `<div class="empty-state">No one has submitted this test yet.</div>` : `
  <table class="results-table">
    <thead><tr><th>Name</th><th>Class</th><th>Number</th><th>Score</th><th>Percent</th><th></th></tr></thead>
    <tbody>
      ${subs.map(s=>{
        const pendingCount = s.detail.filter(d=>d.correct===null).length;
        const pct = s.totalPoints>0 ? Math.round((s.score/s.totalPoints)*100) : 0;
        const pctLabel = pendingCount>0 ? 'Needs review' : pct+'%';
        return `<tr>
          <td>${esc(s.studentName)}</td><td>${esc(s.studentClass)}</td><td>${esc(s.studentNumber)}</td>
          <td>${Math.round(s.score*10)/10} / ${s.totalPoints}</td><td>${pctLabel}</td>
          <td><button class="btn btn-outline btn-sm" onclick="setState({view:'test-result', resultSubmissionId:'${s.id}'})">Review</button></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`}
  `;
}

function renderTakeTest(){
  const t = DATA.tests[state.takingTestId];
  if(!t) return `<p>Test not found.</p>`;
  const questions = (state.takingQuestions && state.takingQuestions.length) ? state.takingQuestions : t.questions;
  const i = state.takingIndex;
  const q = questions[i];
  const total = questions.length;
  const answered = state.takingAnswers[i]!==undefined;

  let qBody = '';
  if(q.type==='mcq'){
    qBody = q.options.map((opt,oi)=>`
      <div class="choice-row ${state.takingAnswers[i]===oi?'selected':''}" onclick="selectMcq(${i},${oi})">
        <span>${esc(opt)}</span>
      </div>
    `).join('');
  } else if(q.type==='msq'){
    const sel = state.takingAnswers[i] || [];
    qBody = q.options.map((opt,oi)=>`
      <div class="choice-row ${sel.includes(oi)?'selected':''}" onclick="toggleMsqAnswer(${i},${oi})">
        <input type="checkbox" ${sel.includes(oi)?'checked':''} onclick="event.stopPropagation();toggleMsqAnswer(${i},${oi})">
        <span>${esc(opt)}</span>
      </div>
    `).join('') + `<div class="meta">Select every choice that applies.</div>`;
  } else if(q.type==='tf'){
    qBody = `
      <div class="choice-row ${state.takingAnswers[i]===true?'selected':''}" onclick="selectTf(${i},true)">True</div>
      <div class="choice-row ${state.takingAnswers[i]===false?'selected':''}" onclick="selectTf(${i},false)">False</div>
    `;
  } else if(q.type==='numeric'){
    const val = state.takingAnswers[i]!==undefined ? state.takingAnswers[i] : '';
    qBody = `
      <div class="field">
        <input type="number" step="any" placeholder="Type your answer" value="${esc(val)}"
          oninput="updateTextAnswer(${i}, this.value)" onblur="render()">
      </div>`;
  } else if(q.type==='order'){
    const order = state.takingAnswers[i] || q.items.map((_,ii)=>ii);
    qBody = order.map((itemIdx,pos)=>`
      <div class="order-item">
        <span class="order-idx mono">${pos+1}</span>
        <span class="order-text">${esc(q.items[itemIdx])}</span>
        <div class="order-btns">
          <button type="button" ${pos===0?'disabled':''} onclick="moveOrderItem(${i},${pos},-1)">↑</button>
          <button type="button" ${pos===order.length-1?'disabled':''} onclick="moveOrderItem(${i},${pos},1)">↓</button>
        </div>
      </div>
    `).join('') + `<div class="meta" style="margin-top:6px;">Use the arrows to arrange these in the correct order.</div>`;
  } else if(q.type==='match'){
    if(!state._shuffleCache) state._shuffleCache = {};
    const cacheKey = state.takingTestId+'-'+i;
    if(!state._shuffleCache[cacheKey]){
      const order = q.defs.map((_,idx)=>idx);
      for(let k=order.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [order[k],order[j]]=[order[j],order[k]]; }
      state._shuffleCache[cacheKey]=order;
    }
    const order = state._shuffleCache[cacheKey];
    const pairs = state.takingAnswers[i] || [];
    const pendLeft = state.takingPending[i];
    qBody = `
      <div class="match-wrap" id="match-wrap-${i}">
        <svg class="match-svg" id="match-svg-${i}"></svg>
        <div class="match-col">
          ${q.terms.map((term,ti)=>{
            const isPaired = pairs.some(p=>p.left===ti);
            const isPending = pendLeft===ti;
            return `<div class="match-item left ${isPaired?'paired':''} ${isPending?'pending':''}" data-side="left" data-idx="${ti}" onclick="matchClickLeft(${i},${ti})">${esc(term)}</div>`;
          }).join('')}
        </div>
        <div class="match-col">
          ${order.map(ri=>{
            const isPaired = pairs.some(p=>p.right===ri);
            return `<div class="match-item right ${isPaired?'paired':''}" data-side="right" data-idx="${ri}" onclick="matchClickRight(${i},${ri})">${esc(q.defs[ri])}</div>`;
          }).join('')}
        </div>
      </div>
      <div class="meta" style="margin-top:10px;">Click a term, then click its matching definition to connect them.</div>
    `;
  } else if(q.type==='short'){
    const val = state.takingAnswers[i] || '';
    qBody = `
      <div class="field">
        <input type="text" placeholder="Type your answer" value="${esc(val)}"
          oninput="updateTextAnswer(${i}, this.value)" onblur="render()">
      </div>`;
  } else if(q.type==='long'){
    const val = state.takingAnswers[i] || '';
    qBody = renderRichToolbar(i) + `
      <div id="rte-${i}" class="rte-editor" contenteditable="true" data-placeholder="Write your answer"
        oninput="richInput(${i}, this)" onfocus="richUpdateToolbarState(${i})" onblur="render()">${val}</div>`;
  } else if(q.type==='cloze'){
    const answers = state.takingAnswers[i] || [];
    qBody = q.blanks.map((b,bi)=>`
      <div class="field">
        <label>Blank ${bi+1}</label>
        <input type="text" placeholder="Type your answer" value="${esc(answers[bi]||'')}"
          oninput="updateClozeBlank(${i},${bi},this.value)" onblur="render()">
      </div>
    `).join('');
  } else if(q.type==='dropdowncloze'){
    const answers = state.takingAnswers[i] || [];
    qBody = q.blanks.map((b,bi)=>{
      const opts = (b.options||'').split(',').map(o=>o.trim()).filter(Boolean);
      return `
      <div class="field">
        <label>Blank ${bi+1}</label>
        <select onchange="selectDropdownCloze(${i},${bi},this.value)">
          <option value="">Choose…</option>
          ${opts.map(o=>`<option value="${esc(o)}" ${answers[bi]===o?'selected':''}>${esc(o)}</option>`).join('')}
        </select>
      </div>`;
    }).join('');
  } else if(q.type==='categorize'){
    const answers = state.takingAnswers[i] || [];
    qBody = q.items.map((item,ii)=>`
      <div class="opt-row">
        <span style="flex:1;">${esc(item.label)}</span>
        <select onchange="selectCategorizeItem(${i},${ii},this.value)">
          <option value="">Choose category…</option>
          ${q.categories.map((cat,ci)=>`<option value="${ci}" ${answers[ii]===ci?'selected':''}>${esc(cat)}</option>`).join('')}
        </select>
      </div>
    `).join('');
  } else if(q.type==='stateset'){
    const answers = state.takingAnswers[i] || [];
    qBody = q.statements.map((st,si)=>`
      <div class="opt-row" style="align-items:center;">
        <span style="flex:1;">${esc(st.text)}</span>
        <div class="choice-row ${answers[si]===true?'selected':''}" style="margin:0;padding:8px 14px;" onclick="selectStatementAnswer(${i},${si},true)">True</div>
        <div class="choice-row ${answers[si]===false?'selected':''}" style="margin:0;padding:8px 14px;" onclick="selectStatementAnswer(${i},${si},false)">False</div>
      </div>
    `).join('');
  } else if(q.type==='rating'){
    const val = state.takingAnswers[i];
    const opts = [];
    for(let v=q.scaleMin; v<=q.scaleMax; v++) opts.push(v);
    qBody = `
      <div class="meta" style="display:flex;justify-content:space-between;">
        <span>${esc(q.minLabel||'')}</span><span>${esc(q.maxLabel||'')}</span>
      </div>
      <div class="rating-row">
        ${opts.map(v=>`<div class="rating-opt ${val===v?'selected':''}" onclick="selectRating(${i},${v})">${v}</div>`).join('')}
      </div>
    `;
  } else if(q.type==='rubric'){
    const val = state.takingAnswers[i] || '';
    qBody = renderRichToolbar(i) + `
      <div id="rte-${i}" class="rte-editor" contenteditable="true" data-placeholder="Write your answer"
        oninput="richInput(${i}, this)" onfocus="richUpdateToolbarState(${i})" onblur="render()">${val}</div>`;
  } else if(q.type==='code'){
    const val = state.takingAnswers[i]!==undefined ? state.takingAnswers[i] : (q.starterCode||'');
    qBody = `
      <div class="field">
        <textarea rows="8" class="mono" placeholder="Write your code"
          oninput="updateTextAnswer(${i}, this.value)" onblur="render()">${esc(val)}</textarea>
      </div>`;
  } else if(q.type==='fileupload'){
    const f = state.takingAnswers[i];
    qBody = `
      <div class="field">
        <input type="file" onchange="handleExamFileAnswer(${i}, this)">
      </div>
      ${f ? `<div class="meta">Selected: ${esc(f.name)} (${formatFileSize(f.size)})</div>` : `<div class="meta">Max file size ${formatFileSize(MAX_PROJECT_FILE_BYTES)}.</div>`}
    `;
  } else if(q.type==='allocation'){
    const answers = state.takingAnswers[i] || {};
    const sum = q.items.reduce((s,_,ii)=> s + (parseFloat(answers[ii])||0), 0);
    qBody = q.items.map((item,ii)=>`
      <div class="opt-row">
        <span style="flex:1;">${esc(item.label)}</span>
        <input type="number" step="any" style="max-width:110px;" value="${answers[ii]!==undefined?esc(answers[ii]):''}"
          oninput="updateAllocationItem(${i},${ii},this.value)" onblur="render()">
      </div>
    `).join('') + `<div class="meta" style="margin-top:8px;">Total: ${sum} / ${q.total}</div>`;
  } else if(q.type==='audio'){
    const rec = state.takingAnswers[i];
    const isRecording = audioRecordingQIndex===i;
    qBody = `
      <div style="margin-bottom:10px;">
        ${isRecording
          ? `<button class="btn btn-danger rec-btn" onclick="stopAudioRecording()"><span class="rec-dot"></span> Stop recording</button>`
          : `<button class="btn btn-outline rec-btn" onclick="startAudioRecording(${i})">🎙 ${rec?'Record again':'Start recording'}</button>`}
      </div>
      ${rec ? `<audio controls src="${rec.dataUrl}" style="width:100%;"></audio>` : `<div class="meta">No recording yet.</div>`}
    `;
  }

  let canSubmitQ;
  if(q.type==='match') canSubmitQ = (state.takingAnswers[i]||[]).length===q.terms.length;
  else if(q.type==='order') canSubmitQ = true;
  else if(q.type==='msq') canSubmitQ = (state.takingAnswers[i]||[]).length>0;
  else if(q.type==='numeric') canSubmitQ = state.takingAnswers[i]!==undefined && String(state.takingAnswers[i]).trim()!=='' && !isNaN(parseFloat(state.takingAnswers[i]));
  else if(q.type==='short' || q.type==='code') canSubmitQ = !!(state.takingAnswers[i] && String(state.takingAnswers[i]).trim());
  else if(q.type==='long' || q.type==='rubric') canSubmitQ = !!(state.takingAnswers[i] && stripHtml(state.takingAnswers[i]));
  else if(q.type==='cloze') canSubmitQ = q.blanks.every((b,bi)=>{ const a=state.takingAnswers[i]||[]; return a[bi] && String(a[bi]).trim(); });
  else if(q.type==='dropdowncloze') canSubmitQ = q.blanks.every((b,bi)=>{ const a=state.takingAnswers[i]||[]; return !!a[bi]; });
  else if(q.type==='categorize') canSubmitQ = q.items.every((it,ii)=>{ const a=state.takingAnswers[i]||[]; return a[ii]!==undefined; });
  else if(q.type==='stateset') canSubmitQ = q.statements.every((st,si)=>{ const a=state.takingAnswers[i]||[]; return a[si]===true || a[si]===false; });
  else if(q.type==='rating') canSubmitQ = state.takingAnswers[i]!==undefined;
  else if(q.type==='fileupload' || q.type==='audio') canSubmitQ = !!(state.takingAnswers[i] && state.takingAnswers[i].dataUrl);
  else if(q.type==='allocation'){
    const a = state.takingAnswers[i] || {};
    const allFilled = q.items.every((it,ii)=> a[ii]!==undefined && String(a[ii]).trim()!=='' && !isNaN(parseFloat(a[ii])));
    const sum = q.items.reduce((s,_,ii)=> s + (parseFloat(a[ii])||0), 0);
    canSubmitQ = allFilled && Math.abs(sum - parseFloat(q.total)) < 0.001;
  }
  else canSubmitQ = answered;

  return `
  <button class="back-link" onclick="exitTakeTest()">← Exit test</button>
  <div class="page-head"><h1>${esc(t.title)}</h1></div>
  ${state.takingDeadlineAt ? `<div class="meta" style="margin-bottom:12px;">⏱ Time remaining: <span id="test-timer" class="mono">${formatCountdown(state.takingDeadlineAt-Date.now())}</span></div>` : ''}
  <div class="progress-track">
    ${questions.map((_,qi)=>`<div class="seg ${state.takingAnswers[qi]!==undefined?'done':''}"></div>`).join('')}
  </div>
  <div class="meta" style="margin-bottom:6px;">Question ${i+1} of ${total}</div>
  <div class="q-text">${esc(q.text)}</div>
  ${qBody}
  <div style="display:flex;justify-content:space-between;margin-top:22px;">
    <button class="btn btn-outline" ${i===0?'disabled':''} onclick="goToQuestion(${i-1})">← Previous</button>
    ${i<total-1
      ? `<button class="btn btn-primary" ${canSubmitQ?'':'disabled'} onclick="goToQuestion(${i+1})">Next →</button>`
      : `<button class="btn btn-primary" ${canSubmitQ?'':'disabled'} onclick="submitTest()">Submit test</button>`}
  </div>
  `;
}

function drawMatchLines(){
  document.querySelectorAll('[id^="match-wrap-"]').forEach(wrap=>{
    const qi = wrap.id.replace('match-wrap-','');
    const svg = document.getElementById('match-svg-'+qi);
    if(!svg) return;
    const wrapRect = wrap.getBoundingClientRect();
    svg.setAttribute('width', wrapRect.width);
    svg.setAttribute('height', wrapRect.height);
    svg.innerHTML='';
    const pairs = state.takingAnswers[qi] || [];
    pairs.forEach(p=>{
      const leftEl = wrap.querySelector(`.match-item.left[data-idx="${p.left}"]`);
      const rightEl = wrap.querySelector(`.match-item.right[data-idx="${p.right}"]`);
      if(!leftEl||!rightEl) return;
      const lr = leftEl.getBoundingClientRect(), rr = rightEl.getBoundingClientRect();
      const x1 = lr.right - wrapRect.left, y1 = lr.top + lr.height/2 - wrapRect.top;
      const x2 = rr.left - wrapRect.left, y2 = rr.top + rr.height/2 - wrapRect.top;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1);
      line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      line.setAttribute('stroke','#3B6EA5'); line.setAttribute('stroke-width','2');
      line.setAttribute('stroke-dasharray','5,4');
      svg.appendChild(line);
    });
  });
}

function renderTestSubmittedNotice(){
  return `
  <div class="auth-wrap">
    <div class="card" style="text-align:center;">
      <h2>Test submitted ✅</h2>
      <p class="meta">Your answers have been recorded. Your teacher will share your results.</p>
      <button class="btn btn-primary btn-full" onclick="setState({view:'student-subject'})">Back to subject</button>
    </div>
  </div>`;
}

function renderTestResult(){
  const sub = DATA.submissions[state.resultSubmissionId];
  if(!sub) return `<p>Result not found.</p>`;
  const t = DATA.tests[sub.testId];
  const pendingCount = sub.detail.filter(d=>d.correct===null).length;
  const pct = sub.totalPoints>0 ? Math.round((sub.score/sub.totalPoints)*100) : 0;
  const backView = state.role==='teacher' ? 'teacher-results' : 'student-subject';
  return `
  <button class="back-link" onclick="setState({view:'${backView}', resultsTestId: '${sub.testId}'})">← Back</button>
  <div class="page-head"><h1>${esc(t.title)}</h1></div>
  ${sub.studentName ? `<div class="meta" style="margin:-14px 0 18px;">${esc(sub.studentName)} · ${esc(sub.studentClass)} · No. ${esc(sub.studentNumber)}</div>` : ''}
  <div class="score-hero">
    <div class="num">${Math.round(sub.score*10)/10}<span>/${sub.totalPoints}</span></div>
    <div class="meta" style="margin-top:6px;">${pct}% correct${pendingCount>0 ? ` · ${pendingCount} response${pendingCount===1?'':'s'} awaiting review` : ''}${sub.scoreOverridden ? ' · final score set by teacher' : ''}</div>
  </div>
  ${state.role==='teacher' ? `
  <div class="card" style="margin-bottom:20px;max-width:380px;">
    <div style="margin-bottom:12px;">
      <h3 style="margin:0 0 8px;font-size:15px;">Adjust final score</h3>
      <div style="display:flex;gap:10px;align-items:flex-end;">
        <div class="field" style="margin-bottom:0;flex:1;">
          <label>Percentage (0–100%)</label>
          <input id="score-override-input" type="number" min="0" max="100" step="1" value="${sub.scoreOverridePercentage || pct}">
        </div>
        <button class="btn btn-primary btn-sm" onclick="overrideSubmissionScore('${state.resultSubmissionId}')">Apply</button>
      </div>
    </div>
  </div>` : ''}
  ${sub.detail.map((d,i)=>{
    const preview = answerPreview(d.question, d.answer);
    const isPending = d.correct===null;
    const tagLabel = isPending ? 'Awaiting review' : (d.correct?'Correct':'Incorrect');
    const rowClass = isPending ? 'pending' : (d.correct?'correct':'incorrect');
    const maxPts = d.maxPoints || 1;
    const earnedPts = d.earnedPoints !== null ? d.earnedPoints : (d.correct===true ? maxPts : 0);

    let correctAnswer = '';
    if(d.question.type==='mcq') correctAnswer = d.question.options[d.question.correct];
    else if(d.question.type==='tf') correctAnswer = d.question.correct ? 'True' : 'False';
    else if(d.question.type==='short') correctAnswer = (d.question.accepted || []).join(' or ');
    else if(d.question.type==='numeric') correctAnswer = d.question.answer + (d.question.tolerance ? ' (±' + d.question.tolerance + ')' : '');
    else if(d.question.type==='match') correctAnswer = d.question.terms.map((t,i)=>''+t+' → '+d.question.defs[i]).join('; ');
    else if(d.question.type==='msq') correctAnswer = d.question.correct.map(i=>d.question.options[i]).join(', ');
    else if(d.question.type==='order') correctAnswer = d.question.items.join(' → ');
    else if(d.question.type==='cloze') correctAnswer = d.question.blanks.map((b,bi)=>'Blank '+(bi+1)+': '+b.accepted).join('; ');
    else if(d.question.type==='dropdowncloze') correctAnswer = d.question.blanks.map((b,bi)=>'Blank '+(bi+1)+': '+b.correct).join('; ');
    else if(d.question.type==='categorize') correctAnswer = d.question.items.map(it=>it.label+' → '+d.question.categories[it.correctCategory]).join('; ');
    else if(d.question.type==='stateset') correctAnswer = d.question.statements.map(st=>st.text+': '+(st.correct?'True':'False')).join('; ');

    let answerBlock = `<div class="meta" style="margin-top:4px;">Answer: ${esc(preview)}</div>`;
    if(d.question.type==='code'){
      answerBlock = `<pre class="mono" style="background:var(--paper-dim);border-radius:8px;padding:10px 12px;margin-top:6px;white-space:pre-wrap;font-size:12.5px;">${esc(d.answer && String(d.answer).trim() ? d.answer : '(no answer)')}</pre>`;
    } else if((d.question.type==='long' || d.question.type==='rubric') && d.answer && stripHtml(d.answer)){
      answerBlock = `<div class="mdesc rte-content" style="margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;">${d.answer}</div>`;
    } else if((d.question.type==='fileupload' || d.question.type==='audio') && d.answer && d.answer.dataUrl){
      answerBlock = d.question.type==='audio'
        ? `<div style="margin-top:6px;"><audio controls src="${d.answer.dataUrl}" style="width:100%;"></audio></div>`
        : `<div style="margin-top:6px;"><a href="${d.answer.dataUrl}" download="${esc(d.answer.name)}"><button class="btn btn-outline btn-sm">⬇ ${esc(d.answer.name)} (${formatFileSize(d.answer.size)})</button></a></div>`;
    }

    let correctBlock = '';
    if(correctAnswer && d.correct!==true){
      if(d.question.type==='code'){
        correctBlock = `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);"><div class="meta" style="margin-bottom:4px;">Expected answer:</div><pre class="mono" style="background:var(--marker-blue-dim);border-radius:8px;padding:10px 12px;white-space:pre-wrap;font-size:12.5px;">${esc(correctAnswer)}</pre></div>`;
      } else {
        correctBlock = `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);"><div class="meta">Expected answer: ${esc(correctAnswer)}</div></div>`;
      }
    }

    return `
    <div class="review-row ${rowClass}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <div class="tag">${tagLabel} · Question ${i+1}</div>
        <div class="meta">${earnedPts}/${maxPts} points</div>
      </div>
      <div style="margin-top:4px;font-weight:600;">${esc(d.question.text)}</div>
      ${answerBlock}
      ${correctBlock}
      ${d.question.type==='long' && d.question.modelAnswer && state.role==='teacher' ? `<div class="meta" style="margin-top:2px;">Model answer: ${esc(d.question.modelAnswer)}</div>` : ''}
      ${d.question.type==='rubric' && d.question.criteria && state.role==='teacher' ? `
        <div class="meta" style="margin-top:6px;"><strong>Rubric:</strong> ${d.question.criteria.map(c=>esc(c.label)+' ('+esc(c.points)+' pts)').join(', ')}</div>` : ''}
      ${isPending && state.role==='teacher' ? `
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-outline btn-sm" onclick="gradeLongAnswer('${state.resultSubmissionId}',${i},true)">Mark correct</button>
          <button class="btn btn-outline btn-sm" onclick="gradeLongAnswer('${state.resultSubmissionId}',${i},false)">Mark incorrect</button>
          <div class="field" style="margin-bottom:0;flex:1;min-width:150px;">
            <label style="font-size:11px;">Points (0–${maxPts})</label>
            <input id="points-input-${i}" type="number" min="0" max="${maxPts}" step="any" value="${earnedPts}" style="width:100%;">
            <button class="btn btn-outline btn-sm" onclick="updateQuestionPoints('${state.resultSubmissionId}',${i})" style="margin-top:4px;width:100%;">Update points</button>
          </div>
        </div>` : ''}
    </div>`;
  }).join('')}
  `;
}

function renderAttendance(){
  const c = Object.assign({id:state.attendanceClassroomId}, DATA.classrooms[state.attendanceClassroomId]);
  if(!c.name) return `<p>Class not found.</p>`;
  const students = classroomStudents(c.id);
  const history = getAttendanceHistory(c.id);
  return `
  <button class="back-link" onclick="setState({view:'classroom-detail', activeClassroomId:'${c.id}'})">← Back</button>
  <div class="page-head"><h1>Attendance — ${esc(c.name)}</h1></div>

  <div class="card" style="margin-bottom:22px;max-width:500px;">
    <h3 style="margin:0 0 12px;font-size:15px;">Add new student</h3>
    <div class="field"><label>Name</label>
      <input id="new-student-name" type="text" placeholder="Full name">
    </div>
    <div class="opt-row">
      <div class="field" style="margin-bottom:0;flex:1;"><label>Class</label>
        <input id="new-student-class" type="text" placeholder="e.g. A">
      </div>
      <div class="field" style="margin-bottom:0;flex:1;"><label>Number</label>
        <input id="new-student-number" type="text" placeholder="e.g. 1">
      </div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="addStudent()">Add student</button>
  </div>

  <h3 style="margin:0 0 10px;font-size:16px;">Take attendance</h3>
  <div style="margin-bottom:16px;">
    <input type="date" id="attendance-date" value="${state.attendanceDate}" onchange="setState({attendanceDate:this.value})" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;">
  </div>

  ${students.length===0 ? `<div class="empty-state">No students added yet.</div>` : `
  <div class="card">
    ${students.map(s=>{
      const status = getAttendanceStatus(s.id, state.attendanceDate);
      return `
      <div class="list-row" style="padding:14px 0;border-bottom:1px solid var(--line);">
        <div style="flex:1;min-width:0;">
          <div style="font-weight:600;">${esc(s.name)}</div>
          <div class="meta">${esc(s.className)} · No. ${esc(s.number)}</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <button class="btn ${status==='present'?'btn-primary':'btn-outline'} btn-sm" onclick="markAttendance('${s.id}','present')">Present</button>
          <button class="btn ${status==='absent'?'btn-danger':'btn-outline'} btn-sm" onclick="markAttendance('${s.id}','absent')">Absent</button>
          <button class="btn ${status==='late'?'btn-primary':'btn-outline'} btn-sm" onclick="markAttendance('${s.id}','late')">Late</button>
          <button class="btn ${status==='sick'?'btn-primary':'btn-outline'} btn-sm" onclick="markAttendance('${s.id}','sick')">Sick</button>
          <button class="btn ${status==='excused'?'btn-primary':'btn-outline'} btn-sm" onclick="markAttendance('${s.id}','excused')">Excused</button>
        </div>
      </div>`;
    }).join('')}
  </div>`}

  ${history.length>0 ? `
  <h3 style="margin:24px 0 10px;font-size:16px;">Attendance history</h3>
  <div class="card">
    ${history.slice(0,10).map(h=>{
      const presentCount = Object.values(h.records).filter(r=>r==='present').length;
      const absentCount = Object.values(h.records).filter(r=>r==='absent').length;
      const lateCount = Object.values(h.records).filter(r=>r==='late').length;
      return `
      <div style="padding:12px 0;border-bottom:1px solid var(--line);">
        <div style="font-weight:600;margin-bottom:4px;">${h.date}</div>
        <div class="meta">Present: ${presentCount} · Absent: ${absentCount} · Late: ${lateCount}</div>
      </div>`;
    }).join('')}
  </div>` : ''}
  `;
}

function renderGradebook(){
  const c = Object.assign({id:state.gradebookClassroomId}, DATA.classrooms[state.gradebookClassroomId]);
  if(!c.name) return `<p>Class not found.</p>`;
  const subjects = classroomSubjects(c.id);
  const students = classroomStudents(c.id);

  return `
  <button class="back-link" onclick="setState({view:'classroom-detail', activeClassroomId:'${c.id}'})">← Back</button>
  <div class="page-head"><h1>Gradebook — ${esc(c.name)}</h1></div>

  ${subjects.length===0 ? `<div class="empty-state">No subjects in this class yet.</div>` : `
  <div class="tabs">
    ${subjects.map(s=>`
      <button class="${state.gradebookSubjectId===s.id?'active':''}" onclick="setState({gradebookSubjectId:'${s.id}'})">${esc(s.name)}</button>
    `).join('')}
  </div>

  ${state.gradebookSubjectId ? `
    ${students.length===0 ? `<div class="empty-state">No students in this class yet.</div>` : `
    <table class="results-table" style="margin-top:16px;">
      <thead><tr><th>Name</th><th>Class</th><th>Number</th><th>Average</th><th>Details</th></tr></thead>
      <tbody>
        ${students.map(s=>{
          const grades = getStudentGrades(s.id, state.gradebookSubjectId);
          const avg = grades.length>0 ? Math.round(grades.reduce((a,g)=>a+g.percent,0)/grades.length) : 0;
          return `
          <tr>
            <td>${esc(s.name)}</td>
            <td>${esc(s.className)}</td>
            <td>${esc(s.number)}</td>
            <td><strong>${avg}%</strong></td>
            <td>
              ${grades.length===0 ? '—' : grades.map(g=>g.testTitle+': '+g.percent+'%').join(', ')}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    `}
  ` : ''}
  `}
  `;
}

(async function boot(){
  document.getElementById('app').innerHTML = '<main><p style="text-align:center;padding:60px;color:#818979;">Loading…</p></main>';
  await loadData();
  render();
})();
</script>
